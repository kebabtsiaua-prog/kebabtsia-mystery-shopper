<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Анкета таємного покупця — Кебабця</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    /* Telegram-тема з фолбеком на світлу тему Telegram */
    --bg: var(--tg-theme-secondary-bg-color, #efeff4);
    --card: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sep: rgba(60,60,67,.14);
    --yes:#34c759; --yes-bg:rgba(52,199,89,.14);
    --no:#ff3b30;  --no-bg:rgba(255,59,48,.12);
    --na:#8e8e93;  --na-bg:rgba(120,120,128,.12);
    --field:rgba(120,120,128,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{-webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
  html,body{background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); font-size:16px; line-height:1.4;
  }

  /* --- Симульований телефон/Telegram-фрейм (у реальному Telegram ховається) --- */
  .frame{max-width:440px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative;
    box-shadow:0 0 0 1px rgba(0,0,0,.05);}
  .tg-bar{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--sep);
    padding:10px 16px; display:flex; align-items:center; gap:10px;}
  .tg-bar .back{color:var(--link); font-size:22px; line-height:1; width:22px;}
  .tg-bar .ttl{flex:1;}
  .tg-bar .ttl b{font-size:16px; font-weight:600; display:block;}
  .tg-bar .ttl span{font-size:12px; color:var(--hint);}
  .tg-bar .dots{color:var(--hint); font-size:20px;}
  .is-tg .frame{max-width:none; box-shadow:none;}
  .is-tg .tg-bar{display:none;}

  .scroll{padding:0 0 96px;}

  /* Логотип угорі (на темній темі інвертується у білий, щоб чорний лого був видний) */
  .brandhead{text-align:center; padding:18px 16px 10px;}
  .brandhead img{height:62px; width:auto; max-width:80%;}
  /* На темній темі — чорний лого на охайному білому бейджі (без негативу) */
  html.tg-dark .brandhead img{background:#fff; padding:9px 18px; border-radius:16px; height:56px;}

  /* --- Згрупований список (iOS/Telegram settings style) --- */
  .cap{font-size:13px; color:var(--hint); text-transform:uppercase; letter-spacing:.02em;
    padding:18px 16px 7px; font-weight:400;}
  .group{background:var(--card); border-top:1px solid var(--sep); border-bottom:1px solid var(--sep);}
  .row{padding:11px 16px; border-bottom:1px solid var(--sep);}
  .row:last-child{border-bottom:none;}
  .row .q{font-size:15px; margin-bottom:9px;}
  .req{color:var(--no); margin-left:2px;}
  .hint{font-size:12.5px; color:var(--hint); margin-top:6px;}

  /* сегмент Так/Ні/Н·Д */
  .seg{display:flex; gap:6px;}
  .seg button{flex:1; padding:9px 4px; font-size:15px; font-weight:500; border:none; border-radius:9px;
    background:var(--field); color:var(--text); cursor:pointer; transition:.12s;}
  .seg button.on-yes{background:var(--yes-bg); color:#0a7a34; box-shadow:inset 0 0 0 1.5px var(--yes);}
  .seg button.on-no{background:var(--no-bg); color:#b3261a; box-shadow:inset 0 0 0 1.5px var(--no);}
  .seg button.on-na{background:var(--na-bg); color:var(--na); box-shadow:inset 0 0 0 1.5px var(--na);}

  /* шкала 1..10 */
  .scale{display:flex; gap:5px;}
  .scale button{flex:1; aspect-ratio:1; min-width:0; font-size:14px; font-weight:600; border:none; border-radius:8px;
    background:var(--field); color:var(--text); cursor:pointer; padding:0;}
  .scale button.on{background:var(--btn); color:var(--btn-text);}
  .scale-ends{display:flex; justify-content:space-between; font-size:11px; color:var(--hint); margin-top:6px;}

  input,textarea,select{
    width:100%; padding:10px 12px; font-size:15px; font-family:inherit; color:var(--text);
    border:none; border-radius:9px; background:var(--field); -webkit-appearance:none; appearance:none;}
  textarea{resize:vertical; min-height:42px; line-height:1.35;}
  select{background:var(--field) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238e8e93' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 12px center; padding-right:32px; font-weight:500;}
  .detail{margin-top:8px;}
  .detail textarea{font-size:14px;}
  label.fld{display:block;}
  label.fld .lab{font-size:15px; margin-bottom:8px; display:block;}

  /* фото */
  .photo{display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--sep);}
  .photo:last-child{border-bottom:none;}
  .photo .name{flex:1; font-size:15px;}
  .photo .name .req{}
  .photo-btn{display:inline-flex; align-items:center; gap:6px; background:var(--field); color:var(--link);
    border:none; border-radius:9px; padding:9px 14px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .photo input{display:none;}
  .thumb{width:42px; height:42px; border-radius:8px; object-fit:cover; display:none;}
  .photo.done .photo-btn{color:var(--yes);}

  /* нижня «MainButton» Telegram (симуляція; у реальному TG ховається) */
  .mainbtn{position:fixed; left:0; right:0; bottom:0; z-index:30; border:none; cursor:pointer;
    background:var(--btn); color:var(--btn-text); font-size:16px; font-weight:600;
    padding:16px; width:100%; max-width:440px; left:50%; transform:translateX(-50%);}
  .mainbtn:disabled{opacity:.5; cursor:not-allowed;}
  .is-tg .mainbtn{display:none;}

  dialog{border:none; border-radius:16px; padding:0; max-width:400px; width:90%;
    box-shadow:0 20px 60px rgba(0,0,0,.3); color:var(--text); background:var(--card);}
  dialog::backdrop{background:rgba(0,0,0,.45);}
  .m-h{padding:16px 18px; border-bottom:1px solid var(--sep); font-size:17px; font-weight:600;}
  .m-b{padding:14px 18px; max-height:62vh; overflow:auto;}
  .m-f{padding:12px 18px; border-top:1px solid var(--sep); text-align:right;}
  .m-f button{background:var(--field); border:none; border-radius:9px; padding:9px 18px; font-weight:600; cursor:pointer; color:var(--link);}
  .score-big{font-size:42px; font-weight:800; text-align:center; margin:4px 0;}
  .sr .row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--sep); font-size:14px;}
  pre{background:var(--field); border-radius:9px; padding:11px; font-size:11px; overflow:auto; margin-top:10px; max-height:180px; line-height:1.35;}

  .gate{display:none; text-align:center; padding:64px 26px;}
  .gate .ic{font-size:46px; margin-bottom:14px;}
  .gate h2{font-size:20px; margin-bottom:8px;}
  .gate p{font-size:14.5px; color:var(--hint); line-height:1.5;}
  body.gating #formwrap{display:none;}
  body.gating .mainbtn{display:none;}
  body.gating #gate{display:block;}
  .pvbanner{background:#fff4d6; color:#7a5b00; font-size:12.5px; text-align:center; padding:8px 14px;}
  @media (prefers-color-scheme: dark){ .pvbanner{background:rgba(255,200,0,.14); color:#e8c24a;} }

  /* ---- ВЛАСНИЙ ДРОПДАУН ---- */
  .csel{position:relative;}
  .csel-trig{display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--field); border-radius:9px; padding:11px 12px; font-size:15px; font-weight:500; cursor:pointer;}
  .csel-trig.on{box-shadow:inset 0 0 0 1.5px var(--btn);}
  .csel-val.ph{color:var(--hint); font-weight:400;}
  .csel-chev{color:var(--hint); font-size:11px; flex-shrink:0;}
  .csel-menu{display:none; position:absolute; left:0; right:0; top:calc(100% + 5px); z-index:60;
    background:var(--card); border:1px solid var(--sep); border-radius:11px;
    box-shadow:0 10px 34px rgba(0,0,0,.35); max-height:260px; overflow-y:auto;}
  .csel-menu.on{display:block;}
  .csel-opt{padding:12px 14px; font-size:15px; cursor:pointer; border-bottom:1px solid var(--sep);}
  .csel-opt:last-child{border-bottom:none;}
  .csel-opt:active{background:var(--field);}
  .csel.locked .csel-trig{opacity:.55; pointer-events:none;}
  .csel.locked .csel-chev{display:none;}

  /* пропущені питання */
  .missing{box-shadow:inset 0 0 0 1.5px var(--no); border-radius:9px;}
  .missing .q, .missing .lab{color:var(--no);}

  /* ---- АДМІН-КАБІНЕТ ---- */
  #admin{display:none;}
  body.admin #formwrap{display:none;}
  body.admin .mainbtn{display:none;}
  body.admin #admin{display:block;}
  .adm-h{padding:16px; font-size:21px; font-weight:800; letter-spacing:-.01em; text-wrap:balance;}
  .adm-sub{font-size:13px; color:var(--hint); font-weight:400; margin-top:2px;}
  .stat-row{display:flex; gap:8px; padding:0 16px 8px;}
  .stat{flex:1; background:var(--card); border:1px solid var(--sep); border-radius:12px; padding:12px; text-align:center;}
  .stat b{font-size:24px; font-weight:800; display:block; font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
  .stat span{font-size:11px; color:var(--hint);}
  .rep-card{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--sep);
    border-radius:13px; padding:12px 14px; margin:8px 16px; cursor:pointer;
    transition-property:transform,background-color; transition-duration:130ms; transition-timing-function:ease-out;}
  .rep-card:active{transform:scale(.985); background:var(--field);}
  .rep-main{flex:1; min-width:0;}
  .rep-loc{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rep-meta{font-size:12px; color:var(--hint); margin-top:2px; font-variant-numeric:tabular-nums;}
  .score-badge{font-size:15px; font-weight:800; padding:5px 11px; border-radius:999px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .chev{color:var(--hint); font-size:18px;}
  .empty{text-align:center; padding:50px 24px; color:var(--hint);}
  .rank-n{font-size:16px; font-weight:800; color:var(--hint); width:24px; text-align:center; flex-shrink:0;}
  .months{display:flex; gap:8px; overflow-x:auto; padding:0 16px 4px; -webkit-overflow-scrolling:touch;}
  .mchip{flex-shrink:0; padding:8px 15px; border-radius:999px; background:var(--field); font-size:13px;
    font-weight:600; cursor:pointer; white-space:nowrap;
    transition-property:transform,background-color,color; transition-duration:130ms; transition-timing-function:ease-out;}
  .mchip:active{transform:scale(.95);}
  .mchip.on{background:var(--btn); color:var(--btn-text);}
  .panel{background:var(--card); border:1px solid var(--sep); border-radius:16px; margin:0 16px; padding:16px 16px 18px;}
  .panel-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
  .accordion .panel-top{cursor:pointer; user-select:none;}
  .pt-right{display:flex; align-items:center; gap:9px;}
  .acc-chev{color:var(--hint); font-size:12px; transition:transform .2s ease;}
  .accordion.open .acc-chev{transform:rotate(180deg);}
  .panel-body{display:none; margin-top:6px;}
  .accordion.open .panel-body{display:block;}
  .chip-done{background:var(--yes-bg); color:var(--yes);}
  .big-num{font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
  .big-num .of{font-size:17px; font-weight:600; color:var(--hint);}
  .pct-badge{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--btn);}
  .prog-track{height:10px; background:var(--field); border-radius:6px; overflow:hidden;}
  .prog-fill{height:100%; background:linear-gradient(90deg,var(--btn),var(--btn)); border-radius:6px;
    transition:width .4s cubic-bezier(.4,0,.2,1);}
  .remain-h{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--hint); margin:16px 0 9px;}
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chip-loc{font-size:12.5px; padding:6px 11px; border-radius:999px; background:var(--field);
    color:var(--text); line-height:1.25; text-wrap:pretty;}
  .remain-done{font-size:14px; color:var(--yes); font-weight:600; margin-top:14px;}

  /* деталі звіту */
  .d-top{padding:14px 16px; border-bottom:1px solid var(--sep); position:sticky; top:0; background:var(--bg); z-index:5;}
  .d-back{color:var(--link); font-size:15px; cursor:pointer; display:inline-flex; gap:5px; align-items:center; margin-bottom:10px;}
  .d-scorerow{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .d-loc{font-size:17px; font-weight:700;}
  .d-big{font-size:30px; font-weight:800;}
  .d-sec{margin:14px 16px 0;}
  .d-sec-h{display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; color:var(--hint); margin-bottom:6px;}
  .d-sec-pct{font-weight:800;}
  .d-item{background:var(--card); border:1px solid var(--sep); border-radius:10px; padding:9px 12px; margin-bottom:6px;}
  .d-q{font-size:12.5px; color:var(--hint); margin-bottom:3px;}
  .d-a{font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px;}
  .d-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .d-detail{font-size:12.5px; color:var(--hint); font-style:italic; margin-top:5px; padding-left:10px; border-left:2px solid var(--sep);}
  .d-txt{background:var(--card); border:1px solid var(--sep); border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:13.5px;}
  .d-txt .lbl{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--hint); margin-bottom:4px;}
  .photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .photo-thumb{display:block; text-decoration:none; color:var(--hint);}
  .photo-thumb img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; border:1px solid var(--sep); display:block;}
  .photo-thumb span{display:block; font-size:11px; text-align:center; margin-top:4px;}
</style>
</head>
<body>
<div class="frame">
  <div class="tg-bar">
    <div class="back">‹</div>
    <div class="ttl"><b>Кебабця</b><span>Анкета таємного покупця</span></div>
    <div class="dots">⋯</div>
  </div>
  <div class="scroll">
    <div class="brandhead"><img src="logo.png?v=2" alt="Кебабця"></div>
    <div id="gate" class="gate"></div>
    <div id="admin"></div>
    <div id="formwrap">
      <div id="pvbanner" class="pvbanner" style="display:none">Режим перегляду — дані не зберігаються</div>
      <form id="f"></form>
    </div>
  </div>
</div>
<button class="mainbtn" id="submit" disabled>Оберіть локацію та дату</button>

<dialog id="result">
  <div class="m-h">Звіт сформовано</div>
  <div class="m-b" id="resultBody"></div>
  <div class="m-f"><button onclick="document.getElementById('result').close()">Закрити</button></div>
</dialog>

<script>
// ================= ЛОКАЦІЇ (керований список — далі з бази) =================
const LOCATIONS = [
  "Гетьмана Мазепи 1б (ТРЦ Спартак)","Хуторівка 4Б","Княгині Ольги 100Л","Шевченка 309",
  "Героїв УПА 73","Валова 13","Нижній Шувар","Шевченка 60 (БЦ Семицвіт)","Червоної Калини 109",
  "Форум Львів","Victoria Gardens","Сокільники (Франка бічна 2)","Крива Липа 8",
  "Чернівецька 13/15","Левандівка","Львів Рясне","Чорновола 16і","Дрогобич","Тернопіль",
  "Шептицький (Героїв Майдану 10)","Чернівці (Небесної сотні 19)"
];

// ================= СТРУКТУРА =================
// bin — Так/Ні/Н·Д (w — вага, ПРИХОВАНА від покупця); scale — 1..10; txt/txtarea/sel — поля
const META = [
  {k:"date", t:"date", label:"Дата візиту", req:1},
  {k:"entry_time", t:"time", label:"Час входу", req:1},
  {k:"exit_time", t:"time", label:"Час виходу", req:1},
  {k:"employee", t:"txt", label:"Імʼя або опис зовнішності працівника", req:1},
  {k:"employee_desc", t:"txt", label:"Зовнішній вигляд співробітника"},
  {k:"receipt_num", t:"txt", label:"Номер чека", hint:"Номер присутній на чеку", req:1},
  {k:"amount", t:"txt", label:"Загальна сума (з чеку), грн", req:1},
  {k:"order", t:"txtarea", label:"Ваше замовлення (позиції, кількість та ціна)", req:1},
];

const SECTIONS = [
  {id:"reception", title:"Прийом замовлення", q:[
    {k:"greeted", w:3, q:"Співробітник привітав вас"},
    {k:"smiled", w:3, q:"Співробітник посміхнувся вам"},
    {k:"helped_choice", q:"Допоміг з вибором, пропонував варіанти", d:1},
    {k:"offered_extra", w:5, q:"Запропонував додаткові страви до замовлення"},
    {k:"desc_kebab", q:"Дав опис складу кебабу", d:1},
    {k:"asked_app", w:2, q:"Запитав, чи є у вас система лояльності / додаток"},
    {k:"offered_app_reg", w:3, q:"Запропонував зареєструватися в додатку"},
    {k:"comment_order", t:"txtarea", q:"Коментар до розділу «Прийом замовлення»"},
  ]},
  {id:"payout", title:"Розрахунок і видача", q:[
    {k:"repeated_order", w:2, q:"Касир повторив ваше остаточне замовлення (склад і ціну) перед розрахунком?"},
    {k:"receipt_match", w:2, q:"Перелік і сума в чеку відповідали замовленню", d:1},
    {k:"app_payment_ok", q:"Оплата через додаток пройшла без проблем", d:1},
    {k:"said_smachnoho", w:3, q:"При видачі побажав «Смачного»"},
    {k:"queue_count", t:"sel", q:"Кількість людей у черзі перед вами",
      opts:["Нікого не було","1","2","3","4","5 і більше"]},
    {k:"queue_time", t:"sel", q:"Час очікування у черзі",
      opts:["Черги не було","До 2 хвилин","До 5 хвилин","До 10 хвилин","До 15 хвилин","Понад 15 хвилин"]},
    {k:"total_time", t:"txt", q:"Загальний час у закладі"},
    {k:"comment_payout", t:"txtarea", q:"Коментар до розділу «Розрахунок і видача»"},
  ]},
  {id:"quality", title:"Оцінка якості страв", q:[
    {k:"packed_well", w:2, q:"Замовлення акуратно загорнуто та упаковано", d:1},
    {k:"taste", t:"sel", q:"Страва була (смак)",
      opts:["Дуже смачно","Так смачно","Не поганий смак","Не смачно"], d:1},
    {k:"temp_ok", w:2, q:"Температура страви прийнятна для споживання"},
    {k:"looks_appetizing", w:2, q:"Страва апетитна на вигляд", d:1},
    {k:"comment_quality", t:"txtarea", q:"Коментар до розділу «Якість страв»"},
  ]},
  {id:"staff", title:"Зовнішній вигляд і поведінка персоналу", q:[
    {k:"staff_neat", w:2, q:"Зовнішній вигляд співробітників охайний, акуратний", d:1},
    {k:"staff_clothes", w:2, q:"Одяг відповідав концепції закладу", d:1},
    {k:"staff_attentive", w:2, q:"Усі співробітники уважні, ввічливі, доброзичливі", d:1},
    {k:"comment_staff", t:"txtarea", q:"Коментар до розділу «Персонал»"},
  ]},
  {id:"clean", title:"Чистота та атмосфера", q:[

// Власний дропдаун у темі Telegram (замість системного <select>)
function mkSelect(options, {value="", placeholder="— оберіть —", onChange}={}){
  const wrap = el(`<div class="csel"></div>`);
  const trig = el(`<div class="csel-trig"><span class="csel-val"></span><span class="csel-chev">▾</span></div>`);
  const menu = el(`<div class="csel-menu"></div>`);
  const valEl = trig.querySelector(".csel-val");
  let cur = value;
  const setVal = (v)=>{ cur=v; valEl.textContent = v || placeholder; valEl.classList.toggle("ph", !v); };
  const close = ()=>{ menu.classList.remove("on"); trig.classList.remove("on"); document.removeEventListener("click", outside, true); };
  const outside = (e)=>{ if(!wrap.contains(e.target)) close(); };
  const open = ()=>{ document.querySelectorAll(".csel-menu.on").forEach(m=>m.classList.remove("on"));
    menu.classList.add("on"); trig.classList.add("on"); setTimeout(()=>document.addEventListener("click", outside, true),0); };
  options.forEach(o=>{ const opt=el(`<div class="csel-opt"></div>`); opt.textContent=o;
    opt.onclick=()=>{ setVal(o); close(); haptic(); onChange&&onChange(o); }; menu.append(opt); });
  setVal(value);
  trig.onclick=(e)=>{ e.stopPropagation(); menu.classList.contains("on")?close():open(); };
  wrap.append(trig, menu);
  wrap._setVal=setVal; wrap._getVal=()=>cur;
  return wrap;
}

// --- поле метаданих / txt / txtarea / sel / scale (спільний рендер контролю) ---
function control(q){
  const wrap = el(`<div></div>`);
  if(q.t==="scale"){
    const start=q.z?0:1; const sc=el(`<div class="scale"></div>`);
    for(let n=start;n<=10;n++){ const b=el(`<button type="button">${n}</button>`);
      b.onclick=()=>{data[q.k]=n; sc.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); haptic(); updateProg();};
      sc.append(b);
    }
    wrap.append(sc, el(`<div class="scale-ends"><span>${q.lo||""}</span><span>${q.hi||""}</span></div>`));
  } else if(q.t==="sel"){
    const base=[...q.opts, ...(q.other?["Інше"]:[])];
    let other;
    if(q.other){ other=el(`<input type="text" placeholder="Вкажіть свій варіант" style="margin-top:8px; display:none;">`);
      other.oninput=()=>{data[q.k]=other.value||null; updateProg();}; }
    const cs=mkSelect(base, { onChange:(v)=>{
      if(q.other && v==="Інше"){ other.style.display="block"; data[q.k]=other.value||null; }
      else { if(other) other.style.display="none"; data[q.k]=v||null; }
      updateProg();
    }});
    wrap.append(cs); if(other) wrap.append(other);
  } else if(q.t==="txtarea"){
    const i=el(`<textarea></textarea>`); i.oninput=()=>{data[q.k]=i.value||null; updateProg();}; wrap.append(i);
  } else { // txt/date/time
    const type = q.t==="txt"?"text":q.t;
    const i=el(`<input type="${type}">`); i.oninput=()=>{data[q.k]=i.value||null; updateProg();}; i.onchange=i.oninput; wrap.append(i);
  }
  return wrap;
}

// Стискаємо фото на пристрої (менший розмір → швидке завантаження і менше сховища)
function compressImage(file, maxDim=1280, quality=0.7){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  });
}

// ================= ПІДРАХУНОК (модель 4Service) =================
function computeScore(){
  const W={reception:0,payout:0,quality:0,staff:0,clean:0}, E={reception:0,payout:0,quality:0,staff:0,clean:0};
  SECTIONS.forEach(s=>{ if(!(s.id in W)) return;
    s.q.forEach(q=>{ if(!q.w) return; const v=data[q.k]; if(v==="na"||v==null) return; W[s.id]+=q.w; if(v==="yes") E[s.id]+=q.w; }); });
  const totW=Object.values(W).reduce((a,b)=>a+b,0), totE=Object.values(E).reduce((a,b)=>a+b,0);
  return {W,E,totW,totE,pct:totW?+(totE/totW*100).toFixed(2):0};
}

const submitBtn=document.getElementById("submit");
const isFilled = (v) => v!=null && v!=="";
function requiredKeys(){
  const keys=["location"];
  META.forEach(m=>{ if(m.req) keys.push(m.k); });
  SECTIONS.forEach(s=> s.q.forEach(q=>{ if(!q.t || q.t==="bin" || q.t==="scale" || q.t==="sel") keys.push(q.k); }));
  PHOTOS.forEach(p=> keys.push(p.k));
  return keys;
}
function plural(n){ const a=n%10,b=n%100; return (a===1&&b!==11)?"питання":(a>=2&&a<=4&&(b<10||b>=20))?"питання":"питань"; }
function validate(){
  document.querySelectorAll(".missing").forEach(e=>e.classList.remove("missing"));
  const miss = requiredKeys().filter(k=>!isFilled(data[k]));
  miss.forEach(k=>{ const r=document.querySelector(`[data-q="${k}"]`); if(r) r.classList.add("missing"); });
  return miss;
}
function updateProg(){
  const req = requiredKeys();
  const done = req.filter(k=>isFilled(data[k])).length;
  req.forEach(k=>{ if(isFilled(data[k])){ const r=document.querySelector(`[data-q="${k}"]`); if(r) r.classList.remove("missing"); } });
  const label = done===req.length ? "Надіслати звіт" : `Заповнено ${done}/${req.length}`;
  if(tg?.MainButton){ tg.MainButton.setText(label); data.location?tg.MainButton.enable():tg.MainButton.disable(); }
  submitBtn.textContent=label; submitBtn.disabled=!data.location;
}
function buildRecord(){
  const s=computeScore();
  // Відповіді без важких base64-фото
  const answers={}; Object.keys(data).forEach(k=>{ if(!k.startsWith("photo_")) answers[k]=data[k]; });
  // Фото окремо: {receipt: base64, facade: ...}
  const photos={}; PHOTOS.forEach(p=>{ const slot=p.k.replace("photo_",""); if(data[p.k]) photos[slot]=data[p.k]; });
  return {
    assignment_id: ASSIGNMENT?.id ?? null,
    location_id: ASSIGNMENT?.location_id ?? null,
    location_name: data.location,
    period: ASSIGNMENT?.period ?? null,
    answers,
    score_pct: s.pct, score_earned: s.totE, score_max: s.totW,
    section_scores: Object.fromEntries(Object.keys(s.W).map(k=>[k,{earned:s.E[k],max:s.W[k]}])),
    photos,
  };
}

async function doSubmit(){
  const miss = validate();
  if(miss.length){
    const first = document.querySelector(".missing");
    if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
    alertMsg(`Ще не заповнено ${miss.length} ${plural(miss.length)}. Дайте, будь ласка, відповідь на всі — вони виділені червоним.`);
    return;
  }
  const s=computeScore();
  if(!tg || !ASSIGNMENT){ showResultModal(s); return; }        // режим перегляду (браузер)
  if(tg.MainButton){ tg.MainButton.showProgress(); tg.MainButton.disable(); }
  try{
    const res = await api("submit", buildRecord());
    if(res.ok){ tg.HapticFeedback?.notificationOccurred?.("success");
      gate("✅","Дякуємо! Звіт прийнято","Ваш звіт збережено. 🙏<br><br><b>Щоб отримати бонуси</b> — напишіть менеджеру, з яким ви спілкувались, і повідомте, що заповнили анкету таємного покупця.<br><br>Дякуємо, що допомагаєте Кебабці ставати кращою! 🧡"); }

    else { alertMsg("Не вдалося надіслати: "+(res.error||"невідома помилка")); }
  }catch(e){ alertMsg("Помилка мережі. Спробуйте ще раз."); }
  finally{ if(tg.MainButton){ tg.MainButton.hideProgress(); tg.MainButton.enable(); } }
}

    const location_id = +document.getElementById("cgLoc").value; if(!location_id) return;
    btn.textContent="Генерую…"; btn.disabled=true;
    const rd = document.getElementById("cgResult");
    try{
      const res = await api("generate_code", { location_id });
      if(res.ok) rd.innerHTML = `<div style="text-align:center;padding:12px;background:var(--field);border-radius:9px;">
        <div style="font-size:12px;color:var(--hint)">Код для «${res.location_name}» · ${res.period}</div>
        <div style="font-size:28px;font-weight:800;letter-spacing:4px;margin:6px 0">${res.code}</div>
        <div style="font-size:12px;color:var(--hint)">Надішліть покупцю. Одноразовий.</div></div>`;
      else rd.innerHTML = `<div style="color:var(--no);font-size:13px">Помилка: ${res.error}</div>`;
    }catch(e){ rd.innerHTML = `<div style="color:var(--no);font-size:13px">Помилка зʼєднання.</div>`; }
    btn.textContent="Згенерувати код"; btn.disabled=false;
  };
}
const MONTHS_UK = ["","січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
function monthLabel(p){ const [y,m]=String(p).split("-"); return `${MONTHS_UK[+m]||m} ${y}`; }
function periodsList(){ return [...new Set(ADMIN_REPORTS.map(r=>r.period).filter(Boolean))].sort().reverse(); }
function reportsFor(p){ return ADMIN_REPORTS.filter(r=>r.period===p).sort((a,b)=>(+b.score_pct||0)-(+a.score_pct||0)); }

function renderList(){
  const periods = periodsList();
  if(!ADMIN_PERIOD || !periods.includes(ADMIN_PERIOD)) ADMIN_PERIOD = periods[0] || null;
  const reps = ADMIN_PERIOD ? reportsFor(ADMIN_PERIOD) : [];
  const avg = reps.length ? Math.round(reps.reduce((s,r)=>s+(+r.score_pct||0),0)/reps.length) : 0;
  const checked = new Set(reps.map(r=>r.location_name));
  const total = ADMIN_LOCATIONS.length;
  const remaining = ADMIN_LOCATIONS.filter(l=>!checked.has(l.name));
  const donePct = total ? Math.round(checked.size/total*100) : 0;

  let h = `<div class="adm-h">Кабінет адміністратора<div class="adm-sub">Таємні покупці</div></div>`;
  h += codeGenBlock();

  // Місяці
  h += `<div class="cap">Місяць перевірок</div><div class="months">`;
  if(!periods.length) h += `<span class="mchip on">Немає даних</span>`;
  periods.forEach(p=> h += `<span class="mchip ${p===ADMIN_PERIOD?'on':''}" data-p="${p}">${monthLabel(p)}</span>`);
  h += `</div>`;

  if(ADMIN_PERIOD){
    h += `<div class="stat-row">
      <div class="stat"><b>${reps.length}</b><span>звітів</span></div>
      <div class="stat"><b style="color:${scoreCol(avg)}">${avg}%</b><span>середній бал</span></div></div>`;

    // Прогрес по локаціях (згортуваний — тап по шапці розгортає списки)
    const checkedNames = [...checked];
    h += `<div class="cap">Перевірено локацій</div>
      <div class="panel accordion" id="locPanel">
        <div class="panel-top" id="locHead">
          <span class="big-num">${checked.size}<span class="of">/${total}</span></span>
          <span class="pt-right"><span class="pct-badge">${donePct}%</span><span class="acc-chev">▾</span></span>
        </div>
        <div class="prog-track"><div class="prog-fill" style="width:${donePct}%"></div></div>
        <div class="panel-body">
          ${checkedNames.length ? `<div class="remain-h" style="color:var(--yes)">Перевірено · ${checkedNames.length}</div>
            <div class="chips">${checkedNames.map(n=>`<span class="chip-loc chip-done">${n}</span>`).join("")}</div>` : ""}
          ${remaining.length ? `<div class="remain-h">Ще не перевірено · ${remaining.length}</div>
            <div class="chips">${remaining.map(l=>`<span class="chip-loc">${l.name}</span>`).join("")}</div>`
            : `<div class="remain-done">✓ Усі локації перевірено цього місяця</div>`}
        </div>
      </div>`;

    // Рейтинг локацій (найкращі → найгірші)
    h += `<div class="cap">Рейтинг локацій</div>`;
    if(!reps.length) h += `<div class="empty">За цей місяць звітів немає.</div>`;
    reps.forEach((r,i)=>{
      const p = Math.round(+r.score_pct||0);
      h += `<div class="rep-card" data-i="${ADMIN_REPORTS.indexOf(r)}">
        <div class="rank-n">${i+1}</div>
        <div class="rep-main"><div class="rep-loc">${r.location_name||"—"}</div>
          <div class="rep-meta">${r.answers?.date||""}${r.shopper_name?" · "+r.shopper_name:""}</div></div>
        <div class="score-badge" style="background:${scoreBg(p)};color:${scoreCol(p)}">${p}%</div></div>`;
    });
  } else {
    h += `<div class="empty">Ще немає жодного звіту.</div>`;
  }

  A.innerHTML = h;
  attachCodeGen();
  const locHead = document.getElementById("locHead");
  if(locHead) locHead.onclick = () => document.getElementById("locPanel").classList.toggle("open");
  A.querySelectorAll(".mchip[data-p]").forEach(c=>c.onclick=()=>{ ADMIN_PERIOD=c.dataset.p; renderList(); });
  A.querySelectorAll(".rep-card").forEach(c=>c.onclick=()=>openDetail(ADMIN_REPORTS[+c.dataset.i]));
  document.querySelector(".scroll").scrollTop = 0;
}

const AV = { yes:["Так","var(--yes)"], no:["Ні","var(--no)"], na:["Н/Д","var(--na)"] };
const binDisp = (v) => { const x=AV[v]; return x?`<span class="d-dot" style="background:${x[1]}"></span>${x[0]}`:`<span style="color:var(--hint)">—</span>`; };

function openDetail(r){
  const ans = r.answers||{}, ss = r.section_scores||{}, p = Math.round(+r.score_pct||0);
  let h = `<div class="d-top"><div class="d-back" id="dback">‹ Усі звіти</div>
    <div class="d-scorerow"><div class="d-loc">${r.location_name||"—"}</div><div class="d-big" style="color:${scoreCol(p)}">${p}%</div></div>
    <div class="rep-meta">${ans.date||""}${r.period?" · "+r.period:""} · ${r.score_earned}/${r.score_max} балів</div></div>`;
  const line=(lbl,val)=> val?`<div class="d-txt"><div class="lbl">${lbl}</div>${val}</div>`:"";
  h += `<div class="d-sec">`;
  h += line("Час у закладі", (ans.entry_time||ans.exit_time)?((ans.entry_time||"—")+" – "+(ans.exit_time||"—")):"");
  h += line("Співробітник", [ans.employee,ans.employee_desc].filter(Boolean).join(" · "));
  h += line("Чек", [ans.receipt_num&&("№ "+ans.receipt_num), ans.amount&&(ans.amount+" грн")].filter(Boolean).join(" · "));
  h += line("Замовлення", ans.order);
  h += `</div>`;
  SECTIONS.forEach(s=>{
    const sc = ss[s.id];
    const pct = sc && sc.max ? Math.round(sc.earned/sc.max*100) : null;
    h += `<div class="d-sec"><div class="d-sec-h"><span>${s.title}</span>${pct!=null?`<span class="d-sec-pct" style="color:${scoreCol(pct)}">${sc.earned}/${sc.max} · ${pct}%</span>`:""}</div>`;
    s.q.forEach(q=>{
      const v = ans[q.k], det = q.d && ans[q.k+"_detail"] ? `<div class="d-detail">${ans[q.k+"_detail"]}</div>` : "";
      if(!q.t || q.t==="bin") h += `<div class="d-item"><div class="d-q">${q.q}</div><div class="d-a">${binDisp(v)}</div>${det}</div>`;
      else if(q.t==="scale") h += `<div class="d-item"><div class="d-q">${q.q}</div><div class="d-a">${v!=null?v+"/10":"—"}</div></div>`;
      else if(v) h += `<div class="d-txt"><div class="lbl">${q.q}</div>${v}${det}</div>`;
    });
    h += `</div>`;
  });
  if(r.photos && Object.keys(r.photos).length){
    const labels={receipt:"Чек",facade:"Фасад",hall:"Зал",dish:"Страва",toilet:"Туалет"};
    h += `<div class="d-sec"><div class="d-sec-h"><span>Фотодокази</span></div><div class="photo-grid">`;
    Object.entries(r.photos).forEach(([slot,url])=>{
      h += `<a href="${url}" target="_blank" rel="noopener" class="photo-thumb"><img src="${url}" alt="${labels[slot]||slot}" loading="lazy"><span>${labels[slot]||slot}</span></a>`;
    });
    h += `</div></div>`;
  }
  A.innerHTML = h;
  document.getElementById("dback").onclick = renderList;
  document.querySelector(".scroll").scrollTop = 0;
}

async function initApp(){
  if(!tg){
    // Локальний файл або ?preview — режим перегляду дизайну. Публічне посилання в браузері — заглушка.
    const preview = location.protocol==="file:" || location.search.includes("preview");
    if(preview){ document.getElementById("pvbanner").style.display="block"; showForm(); updateProg(); }
    else { gate("📱","Відкрийте у Telegram","Ця анкета працює лише через бота Кебабці."); }
    return;
  }
  document.documentElement.classList.add("is-tg");
  tg.ready(); tg.expand();
  const applyScheme = () => document.documentElement.classList.toggle("tg-dark", tg.colorScheme==="dark");
  applyScheme(); tg.onEvent && tg.onEvent("themeChanged", applyScheme);
  tg.MainButton.onClick(doSubmit);
  gate("⏳","Перевірка доступу…","Хвилинку.");
  try{
    const me = await api("me", null);
    if(!me.authorized){ gate("🔒","Немає доступу","Відкрийте, будь ласка, анкету через бота Кебабці."); return; }
    if(me.is_admin){ ADMIN_LOCATIONS = me.locations||[]; adminApp(); return; }
    showCodeEntry();
  }catch(e){ gate("⚠️","Помилка зʼєднання","Спробуйте, будь ласка, пізніше."); }
}
initApp();
</script>

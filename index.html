<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Анкета таємного покупця — Кебабця</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    /* Telegram-тема з фолбеком на світлу тему Telegram */
    --bg: var(--tg-theme-secondary-bg-color, #efeff4);
    --card: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sep: rgba(60,60,67,.14);
    --yes:#34c759; --yes-bg:rgba(52,199,89,.14);
    --no:#ff3b30;  --no-bg:rgba(255,59,48,.12);
    --na:#8e8e93;  --na-bg:rgba(120,120,128,.12);
    --field:rgba(120,120,128,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{-webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
  html,body{background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); font-size:16px; line-height:1.4;
  }

  /* --- Симульований телефон/Telegram-фрейм (у реальному Telegram ховається) --- */
  .frame{max-width:440px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative;
    box-shadow:0 0 0 1px rgba(0,0,0,.05);}
  .tg-bar{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--sep);
    padding:10px 16px; display:flex; align-items:center; gap:10px;}
  .tg-bar .back{color:var(--link); font-size:22px; line-height:1; width:22px;}
  .tg-bar .ttl{flex:1;}
  .tg-bar .ttl b{font-size:16px; font-weight:600; display:block;}
  .tg-bar .ttl span{font-size:12px; color:var(--hint);}
  .tg-bar .dots{color:var(--hint); font-size:20px;}
  .is-tg .frame{max-width:none; box-shadow:none;}
  .is-tg .tg-bar{display:none;}

  .scroll{padding:0 0 96px;}

  /* Логотип угорі (на темній темі інвертується у білий, щоб чорний лого був видний) */
  .brandhead{text-align:center; padding:18px 16px 10px;}
  .brandhead img{height:62px; width:auto; max-width:80%;}
  /* На темній темі — чорний лого на охайному білому бейджі (без негативу) */
  html.tg-dark .brandhead img{background:#fff; padding:9px 18px; border-radius:16px; height:56px;}

  /* --- Згрупований список (iOS/Telegram settings style) --- */
  .cap{font-size:13px; color:var(--hint); text-transform:uppercase; letter-spacing:.02em;
    padding:18px 16px 7px; font-weight:400;}
  .group{background:var(--card); border-top:1px solid var(--sep); border-bottom:1px solid var(--sep);}
  .row{padding:11px 16px; border-bottom:1px solid var(--sep);}
  .row:last-child{border-bottom:none;}
  .row .q{font-size:15px; margin-bottom:9px;}
  .req{color:var(--no); margin-left:2px;}
  .hint{font-size:12.5px; color:var(--hint); margin-top:6px;}

  /* сегмент Так/Ні/Н·Д */
  .seg{display:flex; gap:6px;}
  .seg button{flex:1; padding:9px 4px; font-size:15px; font-weight:500; border:none; border-radius:9px;
    background:var(--field); color:var(--text); cursor:pointer; transition:.12s;}
  .seg button.on-yes{background:var(--yes-bg); color:#0a7a34; box-shadow:inset 0 0 0 1.5px var(--yes);}
  .seg button.on-no{background:var(--no-bg); color:#b3261a; box-shadow:inset 0 0 0 1.5px var(--no);}
  .seg button.on-na{background:var(--na-bg); color:var(--na); box-shadow:inset 0 0 0 1.5px var(--na);}

  /* шкала 1..10 */
  .scale{display:flex; gap:5px;}
  .scale button{flex:1; aspect-ratio:1; min-width:0; font-size:14px; font-weight:600; border:none; border-radius:8px;
    background:var(--field); color:var(--text); cursor:pointer; padding:0;}
  .scale button.on{background:var(--btn); color:var(--btn-text);}
  .scale-ends{display:flex; justify-content:space-between; font-size:11px; color:var(--hint); margin-top:6px;}

  input,textarea,select{
    width:100%; padding:10px 12px; font-size:15px; font-family:inherit; color:var(--text);
    border:none; border-radius:9px; background:var(--field); -webkit-appearance:none; appearance:none;}
  textarea{resize:vertical; min-height:42px; line-height:1.35;}
  select{background:var(--field) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238e8e93' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 12px center; padding-right:32px; font-weight:500;}
  .detail{margin-top:8px;}
  .detail textarea{font-size:14px;}
  label.fld{display:block;}
  label.fld .lab{font-size:15px; margin-bottom:8px; display:block;}

  /* фото */
  .photo{display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--sep);}
  .photo:last-child{border-bottom:none;}
  .photo .name{flex:1; font-size:15px;}
  .photo .name .req{}
  .photo-btn{display:inline-flex; align-items:center; gap:6px; background:var(--field); color:var(--link);
    border:none; border-radius:9px; padding:9px 14px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .photo input{display:none;}
  .thumb{width:42px; height:42px; border-radius:8px; object-fit:cover; display:none;}
  .photo.done .photo-btn{color:var(--yes);}

  /* нижня «MainButton» Telegram (симуляція; у реальному TG ховається) */
  .mainbtn{position:fixed; left:0; right:0; bottom:0; z-index:30; border:none; cursor:pointer;
    background:var(--btn); color:var(--btn-text); font-size:16px; font-weight:600;
    padding:16px; width:100%; max-width:440px; left:50%; transform:translateX(-50%);}
  .mainbtn:disabled{opacity:.5; cursor:not-allowed;}
  .is-tg .mainbtn{display:none;}

  dialog{border:none; border-radius:16px; padding:0; max-width:400px; width:90%;
    box-shadow:0 20px 60px rgba(0,0,0,.3); color:var(--text); background:var(--card);}
  dialog::backdrop{background:rgba(0,0,0,.45);}
  .m-h{padding:16px 18px; border-bottom:1px solid var(--sep); font-size:17px; font-weight:600;}
  .m-b{padding:14px 18px; max-height:62vh; overflow:auto;}
  .m-f{padding:12px 18px; border-top:1px solid var(--sep); text-align:right;}
  .m-f button{background:var(--field); border:none; border-radius:9px; padding:9px 18px; font-weight:600; cursor:pointer; color:var(--link);}
  .score-big{font-size:42px; font-weight:800; text-align:center; margin:4px 0;}
  .sr .row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--sep); font-size:14px;}
  pre{background:var(--field); border-radius:9px; padding:11px; font-size:11px; overflow:auto; margin-top:10px; max-height:180px; line-height:1.35;}

  .gate{display:none; text-align:center; padding:64px 26px;}
  .gate .ic{font-size:46px; margin-bottom:14px;}
  .gate h2{font-size:20px; margin-bottom:8px;}
  .gate p{font-size:14.5px; color:var(--hint); line-height:1.5;}
  body.gating #formwrap{display:none;}
  body.gating .mainbtn{display:none;}
  body.gating #gate{display:block;}
  html.tg-dark .seg button.on-yes{color:var(--yes);}
  html.tg-dark .seg button.on-no{color:var(--no);}
  .pvbanner{background:#fff4d6; color:#7a5b00; font-size:12.5px; text-align:center; padding:8px 14px;}
  @media (prefers-color-scheme: dark){ .pvbanner{background:rgba(255,200,0,.14); color:#e8c24a;} }

  /* ---- ВЛАСНИЙ ДРОПДАУН ---- */
  .csel{position:relative;}
  .csel-trig{display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--field); border-radius:9px; padding:11px 12px; font-size:15px; font-weight:500; cursor:pointer;}
  .csel-trig.on{box-shadow:inset 0 0 0 1.5px var(--btn);}
  .csel-val.ph{color:var(--hint); font-weight:400;}
  .csel-chev{color:var(--hint); font-size:11px; flex-shrink:0;}
  .csel-menu{display:none; position:absolute; left:0; right:0; top:calc(100% + 5px); z-index:60;
    background:var(--card); border:1px solid var(--sep); border-radius:11px;
    box-shadow:0 10px 34px rgba(0,0,0,.35); max-height:min(60vh,420px); overflow-y:auto;}
  .csel-menu.on{display:block;}
  .csel-opt{padding:12px 14px; font-size:15px; cursor:pointer; border-bottom:1px solid var(--sep);}
  .csel-opt:last-child{border-bottom:none;}
  .csel-opt:active{background:var(--field);}
  .csel.locked .csel-trig{opacity:.55; pointer-events:none;}
  .csel.locked .csel-chev{display:none;}

  /* пропущені питання */
  .missing{box-shadow:inset 0 0 0 1.5px var(--no); border-radius:9px;}
  .missing .q, .missing .lab{color:var(--no);}

  /* ---- АДМІН-КАБІНЕТ (стиль як у PDF-звіті) ---- */
  #admin{display:none;}
  body.admin #formwrap{display:none;}
  body.admin .mainbtn{display:none;}
  body.admin #admin{display:block; max-width:860px; margin:0 auto; padding-bottom:28px;}
  body.admin .brandhead{padding-bottom:0;}
  /* у fullscreen на ноуті — відступ згори, щоб контент не ховався під кнопкою закриття */
  .is-tg .scroll{padding-top:var(--tg-top,0);}
  :root{--G:#1f9d55; --Y:#c98a10; --R:#d92c20; --Gt:#e9f7ef; --Yt:#fdf4e3; --Rt:#fdecea; --Rb:#f5c6c2;}
  html.tg-dark{--G:#34c759; --Y:#f0b429; --R:#ff5a4f; --Gt:rgba(52,199,89,.15); --Yt:rgba(240,180,41,.15);
    --Rt:rgba(255,90,79,.13); --Rb:rgba(255,90,79,.3); --sep:rgba(255,255,255,.09); --field:rgba(255,255,255,.07);}
  .adm-h{padding:6px 16px 2px; text-align:center;}
  .adm-h small{display:block; font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--hint); font-weight:700;}
  .h2{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:24px 16px 8px;}
  .h2 b{font-size:16px; font-weight:800; letter-spacing:-.01em;}
  .h2 span{font-size:12.5px; color:var(--hint); text-align:right;}
  .card{background:var(--card); border:1px solid var(--sep); border-radius:14px; margin:0 16px;}
  .card > :first-child{border-top-left-radius:13px; border-top-right-radius:13px;}
  .card > :last-child{border-bottom-left-radius:13px; border-bottom-right-radius:13px;}
  .lbl{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--hint); font-weight:700;}
  .abtn{width:100%; background:var(--btn); color:var(--btn-text); border:none; border-radius:10px; padding:12px;
    font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;}
  .abtn:disabled{opacity:.6;}
  .abtn.ghost{background:var(--field); color:var(--link);}
  .pad{padding:14px;}
  /* код доступу */
  .code-box{margin-top:12px; text-align:center; padding:14px; background:var(--field); border-radius:12px;}
  .code-box .cd{font-size:30px; font-weight:800; letter-spacing:5px; margin:6px 0 12px; font-variant-numeric:tabular-nums; user-select:all;}
  .code-btns{display:flex; gap:8px;}
  .code-btns .abtn{padding:10px;}
  .err{color:var(--R); font-size:13px; margin-top:8px;}
  /* місяці */
  .months{display:flex; gap:7px; overflow-x:auto; padding:2px 16px 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .mchip{flex-shrink:0; padding:7px 14px; border-radius:999px; background:var(--card); border:1px solid var(--sep);
    font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .mchip.on{background:var(--btn); color:var(--btn-text); border-color:var(--btn);}
  /* головні цифри */
  .hero{display:flex; gap:10px; margin:12px 16px 0;}
  .score{flex:1.15; border-radius:14px; padding:14px 12px 13px; text-align:center; border:1px solid var(--sep);}
  .score .big{font-size:46px; font-weight:900; line-height:1.05; margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
  .score .vd{font-size:12.5px; font-weight:800; margin-top:3px;}
  .score .dl{font-size:12px; margin-top:6px; color:var(--hint);}
  .side{flex:1; display:flex; flex-direction:column; gap:10px; min-width:0;}
  .mini{background:var(--card); border:1px solid var(--sep); border-radius:14px; padding:11px 12px; display:flex; align-items:center; gap:10px; flex:1;}
  .mini b{font-size:21px; font-weight:800; display:block; line-height:1.1; font-variant-numeric:tabular-nums;}
  .mini b .of{font-size:13px; color:var(--hint); font-weight:600;}
  .mini small{font-size:11.5px; color:var(--hint); line-height:1.25; display:block;}
  /* смужки */
  .track{height:8px; background:var(--field); border-radius:5px; overflow:hidden;}
  .fill{height:100%; border-radius:5px;}
  .bar-row{display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--sep); cursor:pointer;
    transition:background-color .13s ease-out;}
  .bar-row:first-child, .sec-row:first-child, .fail:first-child, .acc:first-child{border-top:none;}
  .bar-row:active{background:var(--field);}
  .rk{width:18px; font-size:13px; font-weight:800; color:var(--hint); text-align:center; flex-shrink:0;}
  .bmain{flex:1; min-width:0;}
  .bname{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px;}
  .pct{text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums;}
  .pct b{font-size:14px; font-weight:800; display:block;}
  .delta{font-size:11.5px; font-weight:700; white-space:nowrap;}
  .chev{color:var(--hint); font-size:16px; flex-shrink:0;}
  .sec-row{display:flex; align-items:center; gap:10px; padding:9px 14px; border-top:1px solid var(--sep);}
  .sec-row .nm{width:118px; font-size:13px; font-weight:600; line-height:1.25; flex-shrink:0;}
  .sec-row .track{flex:1;}
  .sec-row .pct{width:84px;}
  .sec-row .pct small{font-size:11px; color:var(--hint); font-weight:500;}
  /* порушення */
  .fail{display:flex; gap:10px; padding:10px 14px; border-top:1px solid var(--sep); align-items:center;}
  .fail .q{flex:1; font-size:13.5px; font-weight:600; line-height:1.3; min-width:0;}
  .fail .q small{display:block; font-size:11.5px; color:var(--hint); font-weight:500; margin-top:2px;}
  .fail .q i{display:block; font-size:12.5px; font-weight:400; margin-top:3px; opacity:.8;}
  .cnt{font-size:12.5px; font-weight:800; color:var(--R); background:var(--Rt); border-radius:999px; padding:3px 9px; white-space:nowrap;}
  .failbox{margin:0 16px; border-radius:14px; background:var(--Rt); border:1px solid var(--Rb);}
  .failbox .fail{border-color:var(--Rb); align-items:flex-start;}
  .x{color:var(--R); font-weight:900;}
  .minus{color:var(--R); font-size:12px; font-weight:800; white-space:nowrap;}
  .okbox{margin:0 16px; border-radius:14px; background:var(--Gt); color:var(--G); font-weight:700; padding:14px;}
  .trend{padding:12px 8px 6px;}
  .trend svg{width:100%; height:auto; display:block;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip-loc{font-size:12.5px; padding:5px 10px; border-radius:999px; background:var(--field); line-height:1.25;}
  .chip-done{background:var(--Gt); color:var(--G);}
  .chip-loc.todo{cursor:pointer;}
  .chip-loc.todo:active{background:var(--btn); color:var(--btn-text);}
  .empty{text-align:center; padding:40px 24px; color:var(--hint);}
  /* згортувані блоки */
  .acc{border-top:1px solid var(--sep);}
  .acc-h{display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer; user-select:none;}
  .acc-h b{flex:1; font-size:14.5px; font-weight:600;}
  .acc-h b small{display:block; font-size:12px; color:var(--hint); font-weight:400;}
  .ti{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; background:var(--field); flex-shrink:0;}
  .acc-chev{color:var(--hint); font-size:12px; transition:transform .2s ease;}
  .acc.open .acc-chev{transform:rotate(180deg);}
  .acc-b{display:none; padding:0 14px 14px;}
  .acc.open .acc-b{display:block;}
  /* сторінка локації */
  .d-back{color:var(--link); font-size:15px; cursor:pointer; display:inline-block; padding:12px 16px 0;}
  .dhead{margin:10px 16px 0; display:flex; gap:10px;}
  .dloc{flex:1; min-width:0; padding:14px; margin:0;}
  .dloc .nm{font-size:20px; font-weight:800; line-height:1.2; margin:3px 0 8px; overflow-wrap:anywhere;}
  .dloc .meta{font-size:12.5px; color:var(--hint); line-height:1.6;}
  .dscore{width:132px; flex-shrink:0; border-radius:14px; padding:14px 8px; text-align:center; border:1px solid var(--sep);}
  .dscore .big{font-size:38px; font-weight:900; line-height:1.05; margin-top:4px; font-variant-numeric:tabular-nums;}
  .dscore .pts{font-size:12px; color:var(--hint);}
  .dscore .vd{font-size:12px; font-weight:800; margin-top:4px; line-height:1.25;}
  .prev-line{margin:8px 16px 0; font-size:13px; color:var(--hint); text-align:center;}
  .d-item{padding:9px 0; border-top:1px solid var(--sep);}
  .d-item:first-child{border-top:none;}
  .d-q{font-size:12.5px; color:var(--hint); margin-bottom:3px;}
  .d-a{font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px; white-space:pre-wrap;}
  .d-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .d-detail{font-size:12.5px; color:var(--hint); font-style:italic; margin-top:5px; padding-left:10px; border-left:2px solid var(--sep);}
  .photo-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 16px;}
  .photo-thumb{display:block; text-decoration:none; color:var(--hint);}
  .photo-thumb img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; border:1px solid var(--sep); display:block;}
  .photo-thumb span{display:block; font-size:11px; text-align:center; margin-top:4px;}
</style>
</head>
<body>
<div class="frame">
  <div class="tg-bar">
    <div class="back">‹</div>
    <div class="ttl"><b>Кебабця</b><span>Анкета таємного покупця</span></div>
    <div class="dots">⋯</div>
  </div>
  <div class="scroll">
    <div class="brandhead"><img src="logo.png?v=2" alt="Кебабця"></div>
    <div id="gate" class="gate"></div>
    <div id="admin"></div>
    <div id="formwrap">
      <div id="pvbanner" class="pvbanner" style="display:none">Режим перегляду — дані не зберігаються</div>
      <form id="f"></form>
    </div>
  </div>
</div>
<button class="mainbtn" id="submit" disabled>Оберіть локацію та дату</button>

<dialog id="result">
  <div class="m-h">Звіт сформовано</div>
  <div class="m-b" id="resultBody"></div>
  <div class="m-f"><button onclick="document.getElementById('result').close()">Закрити</button></div>
</dialog>

<script>
// ================= ЛОКАЦІЇ (керований список — далі з бази) =================
const LOCATIONS = [
  "Гетьмана Мазепи 1б (ТРЦ Спартак)","Хуторівка 4Б","Княгині Ольги 100Л","Шевченка 309",
  "Героїв УПА 73","Валова 13","Нижній Шувар","Шевченка 60 (БЦ Семицвіт)","Червоної Калини 109",
  "Форум Львів","Victoria Gardens","Сокільники (Франка бічна 2)","Крива Липа 8",
  "Чернівецька 13/15","Левандівка","Львів Рясне","Чорновола 16і","Дрогобич","Тернопіль",
  "Шептицький (Героїв Майдану 10)","Чернівці (Небесної сотні 19)"
];

// Локації у ТЦ/ТРЦ — туалет там спільний (не наш), тож фото туалету не вимагаємо.
// Якщо треба додати/прибрати локацію — просто зміни цей список.
const MALL_LOCATIONS = new Set([
  "Гетьмана Мазепи 1б (ТРЦ Спартак)",
  "Форум Львів",
  "Victoria Gardens",

// Власний дропдаун у темі Telegram (замість системного <select>)
function mkSelect(options, {value="", placeholder="— оберіть —", onChange}={}){
  const wrap = el(`<div class="csel"></div>`);
  const trig = el(`<div class="csel-trig"><span class="csel-val"></span><span class="csel-chev">▾</span></div>`);
  const menu = el(`<div class="csel-menu"></div>`);
  const valEl = trig.querySelector(".csel-val");
  let cur = value;
  const setVal = (v)=>{ cur=v; valEl.textContent = v || placeholder; valEl.classList.toggle("ph", !v); };
  const close = ()=>{ menu.classList.remove("on"); trig.classList.remove("on"); document.removeEventListener("click", outside, true); };
  const outside = (e)=>{ if(!wrap.contains(e.target)) close(); };
  const open = ()=>{ document.querySelectorAll(".csel-menu.on").forEach(m=>m.classList.remove("on"));
    menu.classList.add("on"); trig.classList.add("on"); setTimeout(()=>document.addEventListener("click", outside, true),0); };
  options.forEach(o=>{ const opt=el(`<div class="csel-opt"></div>`); opt.textContent=o;
    opt.onclick=()=>{ setVal(o); close(); haptic(); onChange&&onChange(o); }; menu.append(opt); });
  setVal(value);
  trig.onclick=(e)=>{ e.stopPropagation(); menu.classList.contains("on")?close():open(); };
  wrap.append(trig, menu);
  wrap._setVal=setVal; wrap._getVal=()=>cur;
  return wrap;
}

// --- поле метаданих / txt / txtarea / sel / scale (спільний рендер контролю) ---
function control(q){
  const wrap = el(`<div></div>`);
  if(q.t==="scale"){
    const start=q.z?0:1; const sc=el(`<div class="scale"></div>`);
    for(let n=start;n<=10;n++){ const b=el(`<button type="button">${n}</button>`);
      b.onclick=()=>{data[q.k]=n; sc.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); haptic(); updateProg();};
      sc.append(b);
    }
    wrap.append(sc, el(`<div class="scale-ends"><span>${q.lo||""}</span><span>${q.hi||""}</span></div>`));
  } else if(q.t==="sel"){
    const base=[...q.opts, ...(q.other?["Інше"]:[])];
    let other;
    if(q.other){ other=el(`<input type="text" placeholder="Вкажіть свій варіант" style="margin-top:8px; display:none;">`);
      other.oninput=()=>{data[q.k]=other.value||null; updateProg();}; }
    const cs=mkSelect(base, { onChange:(v)=>{
      if(q.other && v==="Інше"){ other.style.display="block"; data[q.k]=other.value||null; }
      else { if(other) other.style.display="none"; data[q.k]=v||null; }
      updateProg();
    }});
    wrap.append(cs); if(other) wrap.append(other);
  } else if(q.t==="txtarea"){
    const i=el(`<textarea></textarea>`); i.oninput=()=>{data[q.k]=i.value||null; updateProg();}; wrap.append(i);
  } else { // txt/date/time
    const type = q.t==="txt"?"text":q.t;
    const i=el(`<input type="${type}">`); i.oninput=()=>{data[q.k]=i.value||null; updateProg();}; i.onchange=i.oninput; wrap.append(i);
  }
  return wrap;
}

// Стискаємо фото на пристрої (менший розмір → швидке завантаження і менше сховища)
function compressImage(file, maxDim=1280, quality=0.7){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  });
}
function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
(function(){
  f.append(el(`<div class="cap">Фотодокази<span class="req">*</span> — обовʼязкові</div>`));
  const g=el(`<div class="group"></div>`); f.append(g);
  PHOTOS.forEach(p=>{
    const row=el(`<div class="photo" data-q="${p.k}"><div class="name">${p.label}<span class="req">*</span></div></div>`);
    const img=el(`<img class="thumb">`);
    const btn=el(`<button type="button" class="photo-btn">📷 Додати</button>`);
    const inp=el(`<input type="file" accept="image/*">`);
    btn.onclick=()=>inp.click();
    inp.onchange=async ()=>{
      const file=inp.files[0];
      if(!file){ return; }
      btn.textContent="Обробка…"; btn.disabled=true;
      let b64=null;
      try{ b64=await compressImage(file); }
      catch(e){
        // запасний варіант: якщо не вдалось стиснути (напр. формат), беремо як є, якщо не завелике
        try{ if(file.size < 3*1024*1024) b64=await readAsDataURL(file); }catch(_){}
      }
      if(b64){ data[p.k]=b64; img.src=b64; img.style.display="block"; btn.textContent="✓ Змінити"; row.classList.add("done"); row.classList.remove("missing"); }
      else { data[p.k]=null; btn.textContent="📷 Спробувати ще"; alertMsg("Не вдалося додати це фото. Спробуйте зробити новий знімок або оберіть інше."); }
      btn.disabled=false; updateProg();
    };
    row.append(img, btn, inp); g.append(row);
  });
  f.append(el(`<div class="hint" style="padding:8px 16px 0">Натисніть, щоб зробити фото або обрати з галереї. Усі 5 фото обовʼязкові.</div>`));
})();

// ================= ПІДРАХУНОК (модель 4Service) =================
function computeScore(){
  const W={reception:0,payout:0,quality:0,staff:0,clean:0}, E={reception:0,payout:0,quality:0,staff:0,clean:0};
  SECTIONS.forEach(s=>{ if(!(s.id in W)) return;
    s.q.forEach(q=>{ if(!q.w) return; const v=data[q.k]; if(v==="na"||v==null) return; W[s.id]+=q.w; if(v==="yes") E[s.id]+=q.w; }); });
  const totW=Object.values(W).reduce((a,b)=>a+b,0), totE=Object.values(E).reduce((a,b)=>a+b,0);
  return {W,E,totW,totE,pct:totW?+(totE/totW*100).toFixed(2):0};
}

const submitBtn=document.getElementById("submit");
const isFilled = (v) => v!=null && v!=="";
function requiredKeys(){
  const keys=["location"];
  META.forEach(m=>{ if(m.req) keys.push(m.k); });
  SECTIONS.forEach(s=> s.q.forEach(q=>{ if(!q.t || q.t==="bin" || q.t==="scale" || q.t==="sel" || q.req) keys.push(q.k); }));
  if(HIDE_TOILET_PHOTO) keys.splice(keys.indexOf("toilet_clean"),1);
  PHOTOS.forEach(p=>{ if(p.k==="photo_toilet" && HIDE_TOILET_PHOTO) return; keys.push(p.k); });
  return keys;
}
function plural(n){ const a=n%10,b=n%100; return (a===1&&b!==11)?"питання":(a>=2&&a<=4&&(b<10||b>=20))?"питання":"питань"; }
function validate(){
  document.querySelectorAll(".missing").forEach(e=>e.classList.remove("missing"));
  const miss = requiredKeys().filter(k=>!isFilled(data[k]));
  miss.forEach(k=>{ const r=document.querySelector(`[data-q="${k}"]`); if(r) r.classList.add("missing"); });
  return miss;
}
function updateProg(){
  const req = requiredKeys();
  const done = req.filter(k=>isFilled(data[k])).length;
  req.forEach(k=>{ if(isFilled(data[k])){ const r=document.querySelector(`[data-q="${k}"]`); if(r) r.classList.remove("missing"); } });
  const label = done===req.length ? "Надіслати звіт" : `Заповнено ${done}/${req.length}`;
  if(tg?.MainButton){ tg.MainButton.setText(label); data.location?tg.MainButton.enable():tg.MainButton.disable(); }
  submitBtn.textContent=label; submitBtn.disabled=!data.location;
}
function buildRecord(){
  const s=computeScore();
  // Відповіді без важких base64-фото
  const answers={}; Object.keys(data).forEach(k=>{ if(!k.startsWith("photo_")) answers[k]=data[k]; });
  // Фото окремо: {receipt: base64, facade: ...}
  const photos={}; PHOTOS.forEach(p=>{ const slot=p.k.replace("photo_",""); if(data[p.k]) photos[slot]=data[p.k]; });
  return {
    assignment_id: ASSIGNMENT?.id ?? null,
    location_id: ASSIGNMENT?.location_id ?? null,
    location_name: data.location,
    period: ASSIGNMENT?.period ?? null,
    answers,
    score_pct: s.pct, score_earned: s.totE, score_max: s.totW,
    section_scores: Object.fromEntries(Object.keys(s.W).map(k=>[k,{earned:s.E[k],max:s.W[k]}])),
    photos,
  };
}
function showResultModal(s){
  const col=s.pct>=80?"var(--yes)":s.pct>=60?"#ba7517":"var(--no)";
  const T={reception:"Прийом замовлення",payout:"Розрахунок і видача",quality:"Якість страв",staff:"Персонал",clean:"Чистота"};
  const rows=Object.keys(s.W).map(k=>`<div class="row"><span>${T[k]}</span><span>${s.E[k]}/${s.W[k]} · ${s.W[k]?Math.round(s.E[k]/s.W[k]*100):0}%</span></div>`).join("");
  document.getElementById("resultBody").innerHTML=
    `<div class="score-big" style="color:${col}">${s.pct}%</div>
     <div style="text-align:center;color:var(--hint);font-size:13px;margin-bottom:12px">${s.totE} із ${s.totW} балів · модель 4Service (Н·Д не карає)</div>
     <div class="sr">${rows}</div>
     <div class="hint" style="margin-top:12px">Повний запис звіту:</div>
     <pre>${JSON.stringify({location:data.location, ...data}, null, 1)}</pre>`;
  document.getElementById("result").showModal();
}
async function doSubmit(){
  const miss = validate();
  if(miss.length){
    const first = document.querySelector(".missing");
    if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
    alertMsg(`Ще не заповнено ${miss.length} ${plural(miss.length)}. Дайте, будь ласка, відповідь на всі — вони виділені червоним.`);
    return;
  }
  const s=computeScore();
  if(!tg || !ASSIGNMENT){ showResultModal(s); return; }        // режим перегляду (браузер)
  if(tg.MainButton){ tg.MainButton.showProgress(); tg.MainButton.disable(); }
  try{

// Лінійний графік по місяцях: pts = [{p:"2026-10", v:75}], останній — поточний
function trendSVG(pts, cur){
  const W=360, H=132, pl=24, pr=24, pt=24, pb=24;
  const vs=pts.map(x=>x.v), lo=Math.max(0,Math.min(...vs)-10), hi=Math.min(100,Math.max(...vs)+5);
  const x=i=>pl+i*(W-pl-pr)/(pts.length-1), y=v=>pt+(hi-v)/((hi-lo)||1)*(H-pt-pb);
  return `<svg viewBox="0 0 ${W} ${H}">
    <polyline points="${pts.map((t,i)=>`${x(i)},${y(t.v)}`).join(" ")}" fill="none" style="stroke:var(--btn)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((t,i)=>{ const on=t.p===cur;
      return `<g data-p="${t.p}" style="cursor:pointer"><rect x="${x(i)-22}" y="0" width="44" height="${H}" fill="transparent"/>
      <circle cx="${x(i)}" cy="${y(t.v)}" r="${on?5.5:3.5}" style="fill:${on?"var(--btn)":"var(--card)"};stroke:var(--btn)" stroke-width="2"/>
      <text x="${x(i)}" y="${y(t.v)-11}" text-anchor="middle" font-size="11.5" font-weight="${on?800:600}" style="fill:var(--text)">${t.v}%</text>
      <text x="${x(i)}" y="${H-5}" text-anchor="middle" font-size="11" font-weight="${on?700:400}" style="fill:${on?"var(--text)":"var(--hint)"}">${MONTHS_SHORT[+String(t.p).split("-")[1]]||t.p}</text></g>`;}).join("")}
  </svg>`;
}

  if(!ADMIN_PERIOD || !periods.includes(ADMIN_PERIOD)) ADMIN_PERIOD = periods[0] || null;
  const reps = ADMIN_PERIOD ? reportsFor(ADMIN_PERIOD) : [];
  const prevP = prevPeriodOf(ADMIN_PERIOD), prevReps = prevP ? reportsFor(prevP) : [];
  const avg = avgOf(reps.map(pctOf)), prevAvg = avgOf(prevReps.map(pctOf));
  const prevMonth = prevP ? MONTHS_GEN[+prevP.split("-")[1]] : "";
  const checked = new Set(reps.map(r=>r.location_name));
  const total = ADMIN_LOCATIONS.length;
  const remaining = ADMIN_LOCATIONS.filter(l=>!checked.has(l.name));
  const doneN = total - remaining.length;

  let h = `<div class="adm-h"><small>Кабінет адміністратора</small></div>`;
  h += codeGenBlock();

  // Що ще не перевірено в поточному місяці — одразу під кодом (тап по локації підставляє її в код)
  const nd = new Date(), nowP = `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,"0")}`;
  const doneNow = new Set(reportsFor(nowP).map(r=>r.location_name));
  const todo = ADMIN_LOCATIONS.filter(l=>!doneNow.has(l.name));
  h += `<div class="h2"><b>Ще не перевірено · ${MONTHS_UK[+nowP.split("-")[1]]}</b><span>${todo.length?`${todo.length} з ${total}`:""}</span></div>`;
  h += todo.length ? `<div class="card pad"><div class="chips">${todo.map(l=>`<span class="chip-loc todo" data-n="${escH(l.name)}">${escH(l.name)}</span>`).join("")}</div>
      <div style="font-size:12px;color:var(--hint);margin-top:9px">Тапніть локацію — вона підставиться в код вище.</div></div>`
    : `<div class="okbox">✓ Усі локації перевірено цього місяця</div>`;

  h += `<div class="h2"><b>Місяць перевірок</b></div><div class="months">`;
  if(!periods.length) h += `<span class="mchip on">Немає даних</span>`;
  periods.forEach(p=> h += `<span class="mchip ${p===ADMIN_PERIOD?'on':''}" data-p="${p}">${monthLabel(p)}</span>`);
  h += `</div>`;

  if(ADMIN_PERIOD){
    // Головні цифри
    const d = prevAvg!=null ? avg-prevAvg : null;
    h += `<div class="hero">
      <div class="score" style="background:${scoreBg(avg)}">
        <div class="lbl">Середня оцінка</div>
        <div class="big" style="color:${scoreCol(avg)}">${avg}%</div>
        <div class="vd" style="color:${scoreCol(avg)}">${verdictOf(avg)}</div>
        ${d!=null?`<div class="dl">${deltaHTML(d)} <span>до ${prevMonth} (${prevAvg}%)</span></div>`:""}
      </div>
      <div class="side">
        <div class="mini"><div><b>${reps.length}<span class="of"> ${reps.length%10===1&&reps.length%100!==11?"звіт":"звітів"}</span></b><small>за ${MONTHS_UK[+ADMIN_PERIOD.split("-")[1]]}</small></div></div>
        <div class="mini">${ringSVG(total?doneN/total:0)}<div><b>${doneN}<span class="of">/${total}</span></b><small>локацій перевірено</small></div></div>
      </div></div>`;

    // Рейтинг локацій зі зміною до минулого місяця
    h += `<div class="h2"><b>Рейтинг локацій</b><span>${prevP?`зміна до ${prevMonth}`:"тапніть — відкриється звіт"}</span></div><div class="card">`;
    reps.forEach((r,i)=>{
      const p = pctOf(r), pr = locReport(r.location_name, prevP);
      h += `<div class="bar-row" data-i="${ADMIN_REPORTS.indexOf(r)}"><div class="rk">${i+1}</div>
        <div class="bmain"><div class="bname">${escH(r.location_name||"—")}</div>
          <div class="track"><div class="fill" style="width:${p}%;background:${scoreCol(p)}"></div></div></div>
        <div class="pct"><b style="color:${scoreCol(p)}">${p}%</b>${pr?deltaHTML(p-pctOf(pr)):`<span class="delta" style="color:var(--hint)">новий</span>`}</div>
        <div class="chev">›</div></div>`;
    });
    h += `</div>`;

    // Мережа по розділах
    const secs = sectionAvgs(reps), prevSecs = Object.fromEntries(sectionAvgs(prevReps).map(x=>[x.s.id,x.v]));
    if(secs.length){
      h += `<div class="h2"><b>Мережа по розділах</b><span>середнє</span></div><div class="card">` +
        secs.map(({s,v})=>`<div class="sec-row"><div class="nm">${s.title}</div>
          <div class="track"><div class="fill" style="width:${v}%;background:${scoreCol(v)}"></div></div>
          <div class="pct"><b style="color:${scoreCol(v)}">${v}%</b>${prevSecs[s.id]!=null?deltaHTML(v-prevSecs[s.id]):""}</div></div>`).join("") + `</div>`;
    }

    // Найчастіші порушення (питання з «Ні»)
    const fails = [];
    SECTIONS.forEach(s=>s.q.forEach(q=>{
      if(q.t && q.t!=="bin" || !q.w) return;
      const asked = reps.filter(r=>r.answers?.[q.k]!=null);
      const n = asked.filter(r=>r.answers[q.k]==="no").length;
      if(n) fails.push({q:q.q, s:s.title, n, of:asked.length});
    }));
    fails.sort((a,b)=>b.n-a.n || b.n/b.of-a.n/a.of);
    h += `<div class="h2"><b>Найчастіші порушення</b><span>у скількох звітах «Ні»</span></div>`;
    h += fails.length ? `<div class="card">` + fails.slice(0,5).map(f=>`<div class="fail"><div class="q">${f.q}<small>${f.s}</small></div>
        <span class="cnt">${f.n} з ${f.of}</span></div>`).join("") + `</div>`
      : `<div class="okbox">✓ Порушень цього місяця немає</div>`;

    // Динаміка середньої оцінки по місяцях
    const tp = periods.slice(0,6).reverse().map(p=>({p, v:avgOf(reportsFor(p).map(pctOf))}));
    if(tp.length>=2) h += `<div class="h2"><b>Динаміка</b><span>середня оцінка по місяцях</span></div><div class="card trend" id="trend">${trendSVG(tp, ADMIN_PERIOD)}</div>`;

  } else {
    h += `<div class="empty">Ще немає жодного звіту.</div>`;
  }

  // Інструменти
  const tools = pdfPickBlock(reps) + (IS_SUPER ? adminMgmtBlock() : "");
  if(tools) h += `<div class="h2"><b>Інструменти</b></div><div class="card">${tools}</div>`;

  A.innerHTML = h;
  attachCodeGen();
  if(IS_SUPER) attachAdminMgmt();
  attachPdfPick(reps);
  A.querySelectorAll(".chip-loc.todo").forEach(c=>c.onclick=()=>{
    document.querySelector("#cgLocHolder .csel")._setVal(c.dataset.n); haptic();

  A.querySelectorAll(".mchip[data-p], #trend g[data-p]").forEach(c=>c.onclick=()=>{ ADMIN_PERIOD=c.dataset.p; renderList(); });
  A.querySelectorAll(".bar-row").forEach(c=>c.onclick=()=>openDetail(ADMIN_REPORTS[+c.dataset.i]));
  document.querySelector(".scroll").scrollTop = 0;
}

  // Результат по розділах (смужки)

  // Що виправити — усі «Ні»

  // Деталі візиту
  const det=[["Дата",ans.date],["Час у закладі",time],["Співробітник",[ans.employee,ans.employee_desc].filter(Boolean).join(" · ")],
    ["Чек",[ans.receipt_num&&("№ "+ans.receipt_num),ans.amount&&(ans.amount+" грн")].filter(Boolean).join(" · ")],

      det.map(([l,v])=>`<div style="width:50%;box-sizing:border-box;padding:9px 10px 9px 0">

  // Розділи детально
  h+=`<div data-b style="margin-top:28px;padding-top:14px;border-top:3px solid #111;font-size:19px;font-weight:800">Відповіді по розділах</div>`;

}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Не вдалося завантажити бібліотеку")); document.head.appendChild(s); }); }
async function ensurePdfLibs(){
  if(!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if(!(window.jspdf&&window.jspdf.jsPDF)) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
}
async function urlToDataURL(url){
  const res = await fetch(url); if(!res.ok) throw new Error("photo "+res.status);
  const blob = await res.blob();
  return await new Promise((r,j)=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.onerror=j; fr.readAsDataURL(blob); });
}
// Будує PDF (jsPDF) зі звіту. Сторінки ріжуться лише між блоками data-b.
async function buildReportPDF(r){
  await ensurePdfLibs();
  const photosData = {};
  for(const [slot,url] of Object.entries(r.photos||{})){
    try{ photosData[slot] = await urlToDataURL(url); }catch(_){ /* пропускаємо недоступне фото */ }
  }
  const W = 760;
  const holder = document.createElement("div");
  holder.style.cssText = `position:fixed;left:-9999px;top:0;width:${W}px;background:#fff;box-sizing:border-box`;
  holder.innerHTML = reportInnerHTML(r, photosData);
  document.body.appendChild(holder);
  try{
    await Promise.all([...holder.querySelectorAll("img")].map(img=> img.complete?Promise.resolve():new Promise(res=>{ img.onload=img.onerror=res; })));
    const top0 = holder.getBoundingClientRect().top;
    const blocks = [...holder.querySelectorAll("[data-b]")].map(b=>{ const q=b.getBoundingClientRect(); return [q.top-top0, q.bottom-top0]; });
    const S = 2;
    const canvas = await html2canvas(holder, { scale:S, useCORS:true, backgroundColor:"#fff" });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p","mm","a4");
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    const M = 12, FOOT = 10;                       // поля й місце під нумерацію, мм
    const k = (pw-2*M)/W;                          // мм на 1 css-піксель
    const pageH = (ph-M-FOOT)/k;                   // висота сторінки в css-пікселях
    const H = canvas.height/S;
    const cuts = [0];
    for(let y=0; y<H-1; ){
      let end = Math.min(y+pageH, H);
      if(end < H){
        const cut = blocks.find(([t,b])=> t>y+1 && t<end && b>end);   // блок, що перетинає межу
        if(cut) end = cut[0];
      }
      cuts.push(end); y = end;
    }
    const n = cuts.length-1;
    for(let i=0;i<n;i++){
      const y0=cuts[i]*S, h=Math.ceil((cuts[i+1]-cuts[i])*S);
      const slice = document.createElement("canvas");
      slice.width = canvas.width; slice.height = h;
      slice.getContext("2d").drawImage(canvas, 0, y0, canvas.width, h, 0, 0, canvas.width, h);
      if(i>0) pdf.addPage();
      pdf.addImage(slice.toDataURL("image/jpeg",0.85), "JPEG", M, M, pw-2*M, h/S*k);
      pdf.setFontSize(8); pdf.setTextColor(150);
      pdf.text(`${i+1} / ${n}`, pw-M, ph-6, {align:"right"});
    }
    return pdf;
  } finally { document.body.removeChild(holder); }
}
function pdfFileName(r){
  const safe=(r.location_name||"локація").replace(/[\\/:*?"<>|]+/g,"_").replace(/\s+/g,"_");
  return `Звіт_${safe}_${r.period||""}.pdf`;
}
// У Telegram файл не зберегти напряму з апки — бот надсилає PDF у чат. У браузері — звичайне завантаження.
async function downloadPDF(r, btn){
  const old = btn?.textContent;
  try{
    if(btn){ btn.textContent="Готую PDF…"; btn.disabled=true; }
    const pdf = await buildReportPDF(r);
    const name = pdfFileName(r);
    if(tg?.initData){
      if(btn) btn.textContent="Надсилаю в чат…";
      const res = await api("send_pdf", { pdf: pdf.output("datauristring"), filename: name,
        caption: `${r.location_name||""} · ${r.period?monthLabel(r.period):""} · ${Math.round(+r.score_pct||0)}%` });
      if(res.ok) alertMsg("PDF надіслано вам у чат з ботом 📄");
      else alertMsg(res.error==="unknown_action" ? "Сервер ще не оновлено — потрібно задеплоїти функцію api." : "Не вдалося надіслати PDF: "+(res.error||"?"));
    } else pdf.save(name);
  }catch(e){ alertMsg("Не вдалося зробити PDF: "+(e.message||e)); }
  finally{ if(btn){ btn.textContent=old; btn.disabled=false; } }
}
const PDF_BTN_LABEL = (window.Telegram?.WebApp?.initData) ? "📄 Отримати PDF у чат" : "⬇ Завантажити PDF";
function pdfPickBlock(reps){
  if(!reps.length) return "";
  return `<div class="acc"><div class="acc-h"><div class="ti">📄</div><b>PDF-звіт по локації<small>оцінка, що виправити, фото</small></b><span class="acc-chev">▾</span></div>
    <div class="acc-b">
      <div id="pdfLocHolder" style="margin-bottom:9px"></div>
      <button id="pdfPickBtn" class="abtn">${PDF_BTN_LABEL}</button>
    </div></div>`;
}
function attachPdfPick(reps){
  const holder=document.getElementById("pdfLocHolder"); if(!holder) return;
  const names=[...new Set(reps.map(r=>r.location_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"uk"));
  const cs=mkSelect(names,{placeholder:"— оберіть локацію —"});
  holder.appendChild(cs);
  const btn=document.getElementById("pdfPickBtn");
  btn.onclick=()=>{
    const r=reps.filter(x=>x.location_name===cs._getVal()).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0];  // найсвіжіший
    if(!r){ alertMsg("Оберіть локацію."); return; }
    downloadPDF(r, btn);
  };
}
function openDetail(r){
  const ans = r.answers||{}, p = pctOf(r);
  const prevP = prevPeriodOf(r.period), pr = locReport(r.location_name, prevP);
  const time = (ans.entry_time||ans.exit_time) ? `${ans.entry_time||"—"}–${ans.exit_time||"—"}` : "";
  let h = `<div class="d-back" id="dback">‹ Усі локації</div>
    <div class="dhead">
      <div class="card dloc"><div class="lbl">Локація · ${r.period?monthLabel(r.period):""}</div>
        <div class="nm">${escH(r.location_name||"—")}</div>
        <div class="meta">${ans.date?`📅 ${escH(ans.date)}`:""}${time?` · 🕒 ${escH(time)}`:""}${r.shopper_name?`<br>👤 ${escH(r.shopper_name)}`:""}</div></div>
      <div class="dscore" style="background:${scoreBg(p)}"><div class="lbl">Оцінка</div>
        <div class="big" style="color:${scoreCol(p)}">${p}%</div>
        <div class="pts">${r.score_earned??"—"} з ${r.score_max??"—"} б.</div>
        <div class="vd" style="color:${scoreCol(p)}">${verdictOf(p)}</div></div>
    </div>`;
  if(pr) h += `<div class="prev-line">${monthLabel(prevP)}: ${pctOf(pr)}% → зараз ${p}% · ${deltaHTML(p-pctOf(pr))}</div>`;
  h += `<div style="margin:12px 16px 0"><button id="dlBtn" class="abtn">${PDF_BTN_LABEL}</button></div>`;

  // Результат по розділах (зі зміною до минулого місяця)
  const secs = SECTIONS.map(s=>({s, sc:r.section_scores?.[s.id], v:secPct(r,s.id)})).filter(x=>x.v!=null);
  if(secs.length){
    h += `<div class="h2"><b>Результат по розділах</b>${pr?`<span>зміна до ${MONTHS_GEN[+prevP.split("-")[1]]}</span>`:""}</div><div class="card">` +
      secs.map(({s,sc,v})=>{ const pv = pr ? secPct(pr,s.id) : null;
        return `<div class="sec-row"><div class="nm">${s.title}</div>
        <div class="track"><div class="fill" style="width:${v}%;background:${scoreCol(v)}"></div></div>
        <div class="pct"><b style="color:${scoreCol(v)}">${v}% <small>${sc.earned}/${sc.max}</small></b>${pv!=null?deltaHTML(v-pv):""}</div></div>`; }).join("") + `</div>`;
  }

  // Що виправити — усі «Ні»
  const fails=[];
  SECTIONS.forEach(s=>s.q.forEach(q=>{ if((!q.t||q.t==="bin")&&ans[q.k]==="no") fails.push({s:s.title,q:q.q,d:ans[q.k+"_detail"],w:q.w}); }));
  h += `<div class="h2"><b>Що виправити${fails.length?` · ${fails.length}`:""}</b></div>`;
  h += fails.length ? `<div class="failbox">` + fails.map(f=>`<div class="fail"><span class="x">✗</span>
      <div class="q">${f.q}<small>${f.s}</small>${f.d?`<i>«${escH(f.d)}»</i>`:""}</div>${f.w?`<span class="minus">−${f.w} б.</span>`:""}</div>`).join("") + `</div>`
    : `<div class="okbox">✓ Порушень не виявлено — усі пункти виконано</div>`;

  // Динаміка локації
  const lp = periodsList().slice(0,6).reverse().map(x=>{ const lr=locReport(r.location_name,x); return lr?{p:x,v:pctOf(lr)}:null; }).filter(Boolean);
  if(lp.length>=2) h += `<div class="h2"><b>Динаміка локації</b><span>оцінка по місяцях</span></div><div class="card trend">${trendSVG(lp, r.period)}</div>`;

  // Деталі візиту
  const det=[["Співробітник",[ans.employee,ans.employee_desc].filter(Boolean).join(" · ")],
    ["Чек",[ans.receipt_num&&("№ "+ans.receipt_num),ans.amount&&(ans.amount+" грн")].filter(Boolean).join(" · ")],
    ["Замовлення",ans.order],["Людей у черзі",ans.queue_count],["Очікування в черзі",ans.queue_time],["Загальний час",ans.total_time]].filter(x=>x[1]);
  if(det.length) h += `<div class="h2"><b>Деталі візиту</b></div><div class="card" style="padding:0 14px">` +
    det.map(([l,v])=>`<div class="d-item"><div class="d-q">${l}</div><div class="d-a" style="font-weight:500">${escH(v)}</div></div>`).join("") + `</div>`;

  // Усі відповіді — згорнуті по розділах
  h += `<div class="h2"><b>Усі відповіді</b><span>тапніть розділ</span></div><div class="card">`;
  SECTIONS.forEach(s=>{
    const v = secPct(r,s.id); let rows="";
    s.q.forEach(q=>{
      const a = ans[q.k], det = q.d && ans[q.k+"_detail"] ? `<div class="d-detail">${escH(ans[q.k+"_detail"])}</div>` : "";
      if(!q.t || q.t==="bin"){ if(a==null) return; rows += `<div class="d-item"><div class="d-q">${q.q}</div><div class="d-a">${binDisp(a)}</div>${det}</div>`; }
      else if(q.t==="scale"){ if(a==null) return; rows += `<div class="d-item"><div class="d-q">${q.q}</div><div class="d-a" style="color:${scoreCol(+a*10)}">${a}/10</div></div>`; }
      else if(a) rows += `<div class="d-item"><div class="d-q">${q.q}</div><div class="d-a" style="font-weight:500">${escH(a)}</div>${det}</div>`;
    });
    if(!rows) return;
    h += `<div class="acc"><div class="acc-h"><b>${s.title}</b>${v!=null?`<span style="font-size:13px;font-weight:800;color:${scoreCol(v)}">${v}%</span>`:""}<span class="acc-chev">▾</span></div>
      <div class="acc-b">${rows}</div></div>`;
  });
  h += `</div>`;

  if(r.photos && Object.keys(r.photos).length){
    h += `<div class="h2"><b>Фотодокази</b></div><div class="photo-grid">`;
    Object.entries(r.photos).forEach(([slot,url])=>{
      const l = PHOTO_LABELS[slot]||slot;
      h += `<a href="${url}" target="_blank" rel="noopener" class="photo-thumb"><img src="${url}" alt="${l}" loading="lazy"><span>${l}</span></a>`;
    });
    h += `</div>`;
  }
  A.innerHTML = h;
  document.getElementById("dback").onclick = renderList;
  { const b=document.getElementById("dlBtn"); b.onclick = ()=>downloadPDF(r, b); }
  A.querySelectorAll(".acc-h").forEach(x=>x.onclick=()=>x.parentElement.classList.toggle("open"));
  document.querySelector(".scroll").scrollTop = 0;
}

async function initApp(){
  if(!tg){
    // Локальний файл або ?preview — режим перегляду дизайну. Публічне посилання в браузері — заглушка.
    const preview = location.protocol==="file:" || location.search.includes("preview");
    if(preview){ document.getElementById("pvbanner").style.display="block"; showForm(); updateProg(); }
    else { gate("📱","Відкрийте у Telegram","Ця анкета працює лише через бота Кебабці."); }
    return;
  }
  document.documentElement.classList.add("is-tg");
  tg.ready(); tg.expand();
  try{ tg.requestFullscreen && tg.requestFullscreen(); }catch(e){}
  const applyInsets = () => { const t=(tg.contentSafeAreaInset?.top ?? 0)+(tg.safeAreaInset?.top ?? 0); document.documentElement.style.setProperty("--tg-top", t+"px"); };
  applyInsets();
  tg.onEvent && tg.onEvent("safeAreaChanged", applyInsets);
  tg.onEvent && tg.onEvent("contentSafeAreaChanged", applyInsets);
  tg.onEvent && tg.onEvent("fullscreenChanged", applyInsets);
  const applyScheme = () => document.documentElement.classList.toggle("tg-dark", tg.colorScheme==="dark");
  applyScheme(); tg.onEvent && tg.onEvent("themeChanged", applyScheme);
  tg.MainButton.onClick(doSubmit);
  gate("⏳","Перевірка доступу…","Хвилинку.");
  try{
    const me = await api("me", null);
    if(!me.authorized){ gate("🔒","Немає доступу","Відкрийте, будь ласка, анкету через бота Кебабці."); return; }
    if(me.is_admin){ ADMIN_LOCATIONS = me.locations||[]; IS_SUPER = me.is_super===true; adminApp(); return; }
    showCodeEntry();
  }catch(e){ gate("⚠️","Помилка зʼєднання","Спробуйте, будь ласка, пізніше."); }
}
initApp();

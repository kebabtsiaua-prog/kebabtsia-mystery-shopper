<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Анкета таємного покупця — Кебабця</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    /* Telegram-тема з фолбеком на світлу тему Telegram */
    --bg: var(--tg-theme-secondary-bg-color, #efeff4);
    --card: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sep: rgba(60,60,67,.14);
    --yes:#34c759; --yes-bg:rgba(52,199,89,.14);
    --no:#ff3b30;  --no-bg:rgba(255,59,48,.12);
    --na:#8e8e93;  --na-bg:rgba(120,120,128,.12);
    --field:rgba(120,120,128,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); font-size:16px; line-height:1.4;
  }

  /* --- Симульований телефон/Telegram-фрейм (у реальному Telegram ховається) --- */
  .frame{max-width:440px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative;
    box-shadow:0 0 0 1px rgba(0,0,0,.05);}
  .tg-bar{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--sep);
    padding:10px 16px; display:flex; align-items:center; gap:10px;}
  .tg-bar .back{color:var(--link); font-size:22px; line-height:1; width:22px;}
  .tg-bar .ttl{flex:1;}
  .tg-bar .ttl b{font-size:16px; font-weight:600; display:block;}
  .tg-bar .ttl span{font-size:12px; color:var(--hint);}
  .tg-bar .dots{color:var(--hint); font-size:20px;}
  .is-tg .frame{max-width:none; box-shadow:none;}
  .is-tg .tg-bar{display:none;}

  .scroll{padding:14px 0 96px;}

  /* --- Згрупований список (iOS/Telegram settings style) --- */
  .cap{font-size:13px; color:var(--hint); text-transform:uppercase; letter-spacing:.02em;
    padding:18px 16px 7px; font-weight:400;}
  .group{background:var(--card); border-top:1px solid var(--sep); border-bottom:1px solid var(--sep);}
  .row{padding:11px 16px; border-bottom:1px solid var(--sep);}
  .row:last-child{border-bottom:none;}
  .row .q{font-size:15px; margin-bottom:9px;}
  .req{color:var(--no); margin-left:2px;}
  .hint{font-size:12.5px; color:var(--hint); margin-top:6px;}

  /* сегмент Так/Ні/Н·Д */
  .seg{display:flex; gap:6px;}
  .seg button{flex:1; padding:9px 4px; font-size:15px; font-weight:500; border:none; border-radius:9px;
    background:var(--field); color:var(--text); cursor:pointer; transition:.12s;}
  .seg button.on-yes{background:var(--yes-bg); color:#0a7a34; box-shadow:inset 0 0 0 1.5px var(--yes);}
  .seg button.on-no{background:var(--no-bg); color:#b3261a; box-shadow:inset 0 0 0 1.5px var(--no);}
  .seg button.on-na{background:var(--na-bg); color:var(--na); box-shadow:inset 0 0 0 1.5px var(--na);}

  /* шкала 1..10 */
  .scale{display:flex; gap:5px;}
  .scale button{flex:1; aspect-ratio:1; min-width:0; font-size:14px; font-weight:600; border:none; border-radius:8px;
    background:var(--field); color:var(--text); cursor:pointer; padding:0;}
  .scale button.on{background:var(--btn); color:var(--btn-text);}
  .scale-ends{display:flex; justify-content:space-between; font-size:11px; color:var(--hint); margin-top:6px;}

  input,textarea,select{
    width:100%; padding:10px 12px; font-size:15px; font-family:inherit; color:var(--text);
    border:none; border-radius:9px; background:var(--field); -webkit-appearance:none; appearance:none;}
  textarea{resize:vertical; min-height:42px; line-height:1.35;}
  select{background:var(--field) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238e8e93' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 12px center; padding-right:32px; font-weight:500;}
  .detail{margin-top:8px;}
  .detail textarea{font-size:14px;}
  label.fld{display:block;}
  label.fld .lab{font-size:15px; margin-bottom:8px; display:block;}

  /* фото */
  .photo{display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--sep);}
  .photo:last-child{border-bottom:none;}
  .photo .name{flex:1; font-size:15px;}
  .photo .name .req{}
  .photo-btn{display:inline-flex; align-items:center; gap:6px; background:var(--field); color:var(--link);
    border:none; border-radius:9px; padding:9px 14px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .photo input{display:none;}
  .thumb{width:42px; height:42px; border-radius:8px; object-fit:cover; display:none;}
  .photo.done .photo-btn{color:var(--yes);}

  /* нижня «MainButton» Telegram (симуляція; у реальному TG ховається) */
  .mainbtn{position:fixed; left:0; right:0; bottom:0; z-index:30; border:none; cursor:pointer;
    background:var(--btn); color:var(--btn-text); font-size:16px; font-weight:600;
    padding:16px; width:100%; max-width:440px; left:50%; transform:translateX(-50%);}
  .mainbtn:disabled{opacity:.5; cursor:not-allowed;}
  .is-tg .mainbtn{display:none;}

  dialog{border:none; border-radius:16px; padding:0; max-width:400px; width:90%;
    box-shadow:0 20px 60px rgba(0,0,0,.3); color:var(--text); background:var(--card);}
  dialog::backdrop{background:rgba(0,0,0,.45);}
  .m-h{padding:16px 18px; border-bottom:1px solid var(--sep); font-size:17px; font-weight:600;}
  .m-b{padding:14px 18px; max-height:62vh; overflow:auto;}
  .m-f{padding:12px 18px; border-top:1px solid var(--sep); text-align:right;}
  .m-f button{background:var(--field); border:none; border-radius:9px; padding:9px 18px; font-weight:600; cursor:pointer; color:var(--link);}
  .score-big{font-size:42px; font-weight:800; text-align:center; margin:4px 0;}
  .sr .row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--sep); font-size:14px;}
  pre{background:var(--field); border-radius:9px; padding:11px; font-size:11px; overflow:auto; margin-top:10px; max-height:180px; line-height:1.35;}

  .gate{display:none; text-align:center; padding:64px 26px;}
  .gate .ic{font-size:46px; margin-bottom:14px;}
  .gate h2{font-size:20px; margin-bottom:8px;}
  .gate p{font-size:14.5px; color:var(--hint); line-height:1.5;}
  body.gating #formwrap{display:none;}
  body.gating .mainbtn{display:none;}
  body.gating #gate{display:block;}
  .pvbanner{background:#fff4d6; color:#7a5b00; font-size:12.5px; text-align:center; padding:8px 14px;}
  @media (prefers-color-scheme: dark){ .pvbanner{background:rgba(255,200,0,.14); color:#e8c24a;} }
</style>
</head>
<body>
<div class="frame">
  <div class="tg-bar">
    <div class="back">‹</div>
    <div class="ttl"><b>Кебабця</b><span>Анкета таємного покупця</span></div>
    <div class="dots">⋯</div>
  </div>
  <div class="scroll">
    <div id="gate" class="gate"></div>
    <div id="formwrap">
      <div id="pvbanner" class="pvbanner" style="display:none">Режим перегляду — дані не зберігаються</div>
      <form id="f"></form>
    </div>
  </div>
</div>
<button class="mainbtn" id="submit" disabled>Оберіть локацію та дату</button>

<dialog id="result">
  <div class="m-h">Звіт сформовано</div>
  <div class="m-b" id="resultBody"></div>
  <div class="m-f"><button onclick="document.getElementById('result').close()">Закрити</button></div>
</dialog>

<script>
// ================= ЛОКАЦІЇ (керований список — далі з бази) =================
const LOCATIONS = [
  "Гетьмана Мазепи 1б (ТРЦ Спартак)","Хуторівка 4Б","Княгині Ольги 100Л","Шевченка 309",
  "Героїв УПА 73","Валова 13","Нижній Шувар","Шевченка 60 (БЦ Семицвіт)","Червоної Калини 109",
  "Форум Львів","Victoria Gardens","Сокільники (Франка бічна 2)","Крива Липа 8",
  "Чернівецька 13/15","Левандівка","Львів Рясне","Чорновола 16і","Дрогобич","Тернопіль",
  "Шептицький (Героїв Майдану 10)","Чернівці (Небесної сотні 19)"
];

// ================= СТРУКТУРА =================
// bin — Так/Ні/Н·Д (w — вага, ПРИХОВАНА від покупця); scale — 1..10; txt/txtarea/sel — поля
const META = [
  {k:"date", t:"date", label:"Дата візиту", req:1},
  {k:"entry_time", t:"time", label:"Час входу"},
  {k:"exit_time", t:"time", label:"Час виходу"},
  {k:"employee", t:"txt", label:"Імʼя або опис зовнішності працівника"},
  {k:"employee_desc", t:"txt", label:"Зовнішній вигляд співробітника"},
  {k:"receipt_num", t:"txt", label:"Номер чека", hint:"Номер присутній на чеку"},
  {k:"amount", t:"txt", label:"Загальна сума (з чеку), грн"},
  {k:"order", t:"txtarea", label:"Ваше замовлення (позиції, кількість та ціна)"},
];

const SECTIONS = [
  {id:"reception", title:"Прийом замовлення", q:[
    {k:"greeted", w:3, q:"Співробітник привітав вас"},
    {k:"smiled", w:3, q:"Співробітник посміхнувся вам"},
    {k:"helped_choice", q:"Допоміг з вибором, пропонував варіанти", d:1},
    {k:"offered_extra", w:5, q:"Запропонував додаткові страви до замовлення"},
    {k:"desc_kebab", q:"Дав опис складу кебабу", d:1},
    {k:"asked_app", w:2, q:"Запитав, чи є у вас система лояльності / додаток"},
    {k:"offered_app_reg", w:3, q:"Запропонував зареєструватися в додатку"},
    {k:"told_wait_time", q:"Повідомив про час очікування", d:1},
    {k:"comment_order", t:"txtarea", q:"Коментар до розділу «Прийом замовлення»"},
  ]},
  {id:"payout", title:"Розрахунок і видача", q:[
    {k:"repeated_order", w:2, q:"Касир повторив ваше остаточне замовлення (склад і ціну) перед розрахунком?"},
    {k:"receipt_match", w:2, q:"Перелік і сума в чеку відповідали замовленню", d:1},
    {k:"app_payment_ok", q:"Оплата через додаток пройшла без проблем", d:1},
    {k:"said_smachnoho", w:3, q:"При видачі побажав «Смачного»"},
    {k:"queue_count", t:"sel", q:"Кількість людей у черзі перед вами",
      opts:["Нікого не було","1","2","3","4","5 і більше"]},
    {k:"queue_time", t:"sel", q:"Час очікування у черзі",
      opts:["Черги не було","До 2 хвилин","До 5 хвилин","До 10 хвилин","До 15 хвилин","Понад 15 хвилин"]},
    {k:"total_time", t:"txt", q:"Загальний час у закладі"},
    {k:"comment_payout", t:"txtarea", q:"Коментар до розділу «Розрахунок і видача»"},
  ]},
  {id:"quality", title:"Оцінка якості страв", q:[
    {k:"packed_well", w:2, q:"Замовлення акуратно загорнуто та упаковано", d:1},
    {k:"taste", t:"sel", q:"Страва була (смак)",
      opts:["Дуже смачно","Так смачно","Не поганий смак","Не смачно"], d:1},
    {k:"temp_ok", w:2, q:"Температура страви прийнятна для споживання"},
    {k:"looks_appetizing", w:2, q:"Страва апетитна на вигляд", d:1},
    {k:"comment_quality", t:"txtarea", q:"Коментар до розділу «Якість страв»"},
  ]},
  {id:"staff", title:"Зовнішній вигляд і поведінка персоналу", q:[
    {k:"staff_neat", w:2, q:"Зовнішній вигляд співробітників охайний, акуратний", d:1},
    {k:"staff_clothes", w:2, q:"Одяг відповідав концепції закладу", d:1},
    {k:"staff_attentive", w:2, q:"Усі співробітники уважні, ввічливі, доброзичливі", d:1},
    {k:"comment_staff", t:"txtarea", q:"Коментар до розділу «Персонал»"},
  ]},
  {id:"clean", title:"Чистота та атмосфера", q:[
    {k:"facade_clean", w:1, q:"Фасад, вивіска, прилегла територія чисті"},
    {k:"trash_clean", w:1, q:"Урна для сміття чиста"},
    {k:"floor_clean", w:2, q:"Підлога в залі чиста, без плям і бруду", d:1},
    {k:"tables_clean", w:2, q:"Столи прибрані та чисті", d:1},
    {k:"furniture_neat", w:2, q:"Меблі в залі в охайному стані", d:1},
    {k:"comfort_temp", w:2, q:"Комфортна температура, без неприємних запахів"},
    {k:"toilet_clean", w:2, q:"Туалетна кімната прибрана"},
    {k:"violations", t:"txtarea", q:"Помічені порушення (якщо були)"},
    {k:"comment_clean", t:"txtarea", q:"Коментар до розділу «Чистота та атмосфера»"},
  ]},
  {id:"impression", title:"Суб'єктивне враження", q:[
    {k:"scale_polite", t:"scale", q:"Ввічливість і доброзичливість", lo:"Дуже погане", hi:"Перевершило"},
    {k:"scale_speed", t:"scale", q:"Швидкість обслуговування", lo:"Дуже повільно", hi:"Дуже оперативно"},
    {k:"scale_convenience", t:"scale", q:"Зручність оформлення замовлення", lo:"Незручно", hi:"Легко і зрозуміло"},
    {k:"scale_interior", t:"scale", q:"Інтер'єр (комфорт для відвідувача)", lo:"Не сподобався", hi:"Перевершив"},
    {k:"better_than", t:"txt", q:"У цій мережі КРАЩЕ, ніж…"},
    {k:"worse_than", t:"txt", q:"У цій мережі ГІРШЕ, ніж…"},
    {k:"liked", t:"txtarea", q:"Що сподобалось під час візиту"},
    {k:"disliked", t:"txtarea", q:"Що не сподобалось під час візиту"},
  ]},
  {id:"nps", title:"Підсумок і рекомендація", q:[
    {k:"nps", t:"scale", z:1, q:"Наскільки ймовірно, що порекомендуєте мережу (0–10)", lo:"Не порекомендую", hi:"Обовʼязково"},
    {k:"nps_reason", t:"txtarea", q:"Чому саме така оцінка / що змінити"},
    {k:"advantage", t:"sel", q:"Головна перевага закладу", other:1,
      opts:["Продукт","Ціна","Сервіс","Місцезнаходження","Атмосфера","Швидкість обслуговування"]},
    {k:"will_return", t:"sel", q:"Чи будете відвідувати мережу надалі",
      opts:["Так","Ні","Не визначився"]},
    {k:"wont_return_reason", t:"txt", q:"Що може змусити НЕ повернутися"},
    {k:"better_than_others", t:"txtarea", q:"Що заклад робить краще за інших"},
    {k:"worst_experience", t:"txt", q:"Що найбільше псує досвід"},
    {k:"improve", t:"txtarea", q:"Що варто покращити"},
  ]},
];

const PHOTOS = [
  {k:"photo_receipt", label:"Фото чека"},
  {k:"photo_facade", label:"Фасад / вхід"},
  {k:"photo_hall", label:"Зал"},
  {k:"photo_dish", label:"Страва"},
  {k:"photo_toilet", label:"Туалет"},
];

// ================= СТАН =================
const data = {location:"", ...Object.fromEntries(
  [...META, ...SECTIONS.flatMap(s=>s.q)].map(x=>[x.k, null]))};

const f = document.getElementById("f");
const el = h => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstChild; };
function group(cap){ f.append(el(`<div class="cap">${cap}</div>`)); const g=el(`<div class="group"></div>`); f.append(g); return g; }

// --- поле метаданих / txt / txtarea / sel / scale (спільний рендер контролю) ---
function control(q){
  const wrap = el(`<div></div>`);
  if(q.t==="scale"){
    const start=q.z?0:1; const sc=el(`<div class="scale"></div>`);
    for(let n=start;n<=10;n++){ const b=el(`<button type="button">${n}</button>`);
      b.onclick=()=>{data[q.k]=n; sc.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); haptic(); updateProg();};
      sc.append(b);
    }
    wrap.append(sc, el(`<div class="scale-ends"><span>${q.lo||""}</span><span>${q.hi||""}</span></div>`));
  } else if(q.t==="sel"){
    const opts=[...q.opts, ...(q.other?["Інше"]:[])];
    const sel=el(`<select><option value="">— оберіть —</option>${opts.map(o=>`<option>${o}</option>`).join("")}</select>`);
    let other;
    if(q.other){ other=el(`<input type="text" placeholder="Вкажіть свій варіант" style="margin-top:8px; display:none;">`);
      other.oninput=()=>{data[q.k]=other.value||null; updateProg();}; }
    sel.onchange=()=>{
      if(q.other && sel.value==="Інше"){ other.style.display="block"; data[q.k]=other.value||null; }
      else { if(other) other.style.display="none"; data[q.k]=sel.value||null; }
      updateProg();
    };
    wrap.append(sel); if(other) wrap.append(other);
  } else if(q.t==="txtarea"){
    const i=el(`<textarea></textarea>`); i.oninput=()=>{data[q.k]=i.value||null; updateProg();}; wrap.append(i);
  } else { // txt/date/time
    const type = q.t==="txt"?"text":q.t;
    const i=el(`<input type="${type}">`); i.oninput=()=>{data[q.k]=i.value||null; updateProg();}; i.onchange=i.oninput; wrap.append(i);
  }
  return wrap;
}

// ================= ЛОКАЦІЯ + МЕТА =================
(function(){
  const g = group("Локація та візит");
  const rLoc = el(`<div class="row" id="locRow"><div class="q">Заклад<span class="req">*</span></div></div>`);
  const sel = el(`<select id="locSelect"><option value="">— оберіть локацію —</option>${LOCATIONS.map(l=>`<option>${l}</option>`).join("")}<option value="__other">Інша (вписати адресу)</option></select>`);
  const other = el(`<input type="text" placeholder="Вкажіть адресу закладу" style="margin-top:8px; display:none;">`);
  sel.onchange=()=>{ if(sel.value==="__other"){other.style.display="block"; data.location=other.value;} else {other.style.display="none"; data.location=sel.value;} updateProg(); };
  other.oninput=()=>{data.location=other.value; updateProg();};
  rLoc.append(sel, other); g.append(rLoc);
  META.forEach(m=>{
    const r=el(`<div class="row"><label class="fld"><span class="lab">${m.label}${m.req?'<span class="req">*</span>':''}</span></label></div>`);
    r.querySelector("label").append(control(m));
    if(m.hint) r.append(el(`<div class="hint">${m.hint}</div>`));
    g.append(r);
  });
})();

// ================= СЕКЦІЇ =================
SECTIONS.forEach(s=>{
  const g = group(s.title);
  s.q.forEach(q=>{
    const r = el(`<div class="row"><div class="q">${q.q}</div></div>`);
    if(!q.t || q.t==="bin"){
      const seg=el(`<div class="seg"><button type="button" data-v="yes">Так</button><button type="button" data-v="no">Ні</button><button type="button" data-v="na">Н·Д</button></div>`);
      seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{data[q.k]=b.dataset.v; seg.querySelectorAll("button").forEach(x=>x.className=""); b.className="on-"+b.dataset.v; haptic(); updateProg();});
      r.append(seg);
    } else {
      r.append(control(q));
    }
    if(q.d){ const dk=q.k+"_detail"; data[dk]=null;
      const det=el(`<div class="detail"><textarea placeholder="Деталі / коментар (необовʼязково)"></textarea></div>`);
      det.querySelector("textarea").oninput=e=>{data[dk]=e.target.value||null;}; r.append(det); }
    g.append(r);
  });
});

// ================= ФОТО =================
(function(){
  f.append(el(`<div class="cap">Фотодокази<span class="req">*</span> — обовʼязкові</div>`));
  const g=el(`<div class="group"></div>`); f.append(g);
  PHOTOS.forEach(p=>{
    const row=el(`<div class="photo"><div class="name">${p.label}<span class="req">*</span></div></div>`);
    const img=el(`<img class="thumb">`);
    const btn=el(`<button type="button" class="photo-btn">📷 Додати</button>`);
    const inp=el(`<input type="file" accept="image/*" capture="environment">`);
    btn.onclick=()=>inp.click();
    inp.onchange=()=>{ const file=inp.files[0]; data[p.k]=file?file.name:null;
      if(file){img.src=URL.createObjectURL(file); img.style.display="block"; btn.textContent="✓ Змінити"; row.classList.add("done");} updateProg(); };
    row.append(img, btn, inp); g.append(row);
  });
  f.append(el(`<div class="hint" style="padding:8px 16px 0">У Telegram кнопка відкриває камеру або галерею. Фото завантажаться у сховище автоматично. У цьому прототипі вони поки не зберігаються.</div>`));
})();

// ================= ПІДРАХУНОК (модель 4Service) =================
function computeScore(){
  const W={reception:0,payout:0,quality:0,staff:0,clean:0}, E={reception:0,payout:0,quality:0,staff:0,clean:0};
  SECTIONS.forEach(s=>{ if(!(s.id in W)) return;
    s.q.forEach(q=>{ if(!q.w) return; const v=data[q.k]; if(v==="na"||v==null) return; W[s.id]+=q.w; if(v==="yes") E[s.id]+=q.w; }); });
  const totW=Object.values(W).reduce((a,b)=>a+b,0), totE=Object.values(E).reduce((a,b)=>a+b,0);
  return {W,E,totW,totE,pct:totW?+(totE/totW*100).toFixed(2):0};
}

// ================= ПРОГРЕС / SUBMIT =================
const submitBtn=document.getElementById("submit");
function updateProg(){
  const scored=SECTIONS.flatMap(s=>s.q).filter(q=>q.w);
  const done=scored.filter(q=>data[q.k]).length;
  const ok = data.location && data.date;
  const label = ok ? `Надіслати звіт · ${done}/${scored.length}`
              : data.location ? "Вкажіть дату візиту" : "Оберіть локацію та дату";
  if(tg?.MainButton){
    tg.MainButton.setText(ok?"Надіслати звіт":label);
    ok?tg.MainButton.enable():tg.MainButton.disable();
  }
  submitBtn.textContent=label; submitBtn.disabled=!ok;
}
function buildRecord(){
  const s=computeScore();
  return {
    assignment_id: ASSIGNMENT?.id ?? null,
    location_id: ASSIGNMENT?.location_id ?? null,
    location_name: data.location,
    period: ASSIGNMENT?.period ?? null,
    answers: {...data},
    score_pct: s.pct, score_earned: s.totE, score_max: s.totW,
    section_scores: Object.fromEntries(Object.keys(s.W).map(k=>[k,{earned:s.E[k],max:s.W[k]}])),
    photos: null,
  };
}
function showResultModal(s){
  const col=s.pct>=80?"var(--yes)":s.pct>=60?"#ba7517":"var(--no)";
  const T={reception:"Прийом замовлення",payout:"Розрахунок і видача",quality:"Якість страв",staff:"Персонал",clean:"Чистота"};
  const rows=Object.keys(s.W).map(k=>`<div class="row"><span>${T[k]}</span><span>${s.E[k]}/${s.W[k]} · ${s.W[k]?Math.round(s.E[k]/s.W[k]*100):0}%</span></div>`).join("");
  document.getElementById("resultBody").innerHTML=
    `<div class="score-big" style="color:${col}">${s.pct}%</div>
     <div style="text-align:center;color:var(--hint);font-size:13px;margin-bottom:12px">${s.totE} із ${s.totW} балів · модель 4Service (Н·Д не карає)</div>
     <div class="sr">${rows}</div>
     <div class="hint" style="margin-top:12px">Повний запис звіту:</div>
     <pre>${JSON.stringify({location:data.location, ...data}, null, 1)}</pre>`;
  document.getElementById("result").showModal();
}
async function doSubmit(){
  const s=computeScore();
  if(!tg || !ASSIGNMENT){ showResultModal(s); return; }        // режим перегляду (браузер)
  if(tg.MainButton){ tg.MainButton.showProgress(); tg.MainButton.disable(); }
  try{
    const res = await api("submit", buildRecord());
    if(res.ok){ tg.HapticFeedback?.notificationOccurred?.("success");
      gate("✅","Дякуємо, звіт прийнято","Ваш звіт збережено. Гарного дня!"); }
    else if(res.error==="already_done"){ gate("✔️","Звіт уже здано","Це завдання вже закрите."); }
    else { alertMsg("Не вдалося надіслати: "+(res.error||"невідома помилка")); }
  }catch(e){ alertMsg("Помилка мережі. Спробуйте ще раз."); }
  finally{ if(tg.MainButton){ tg.MainButton.hideProgress(); tg.MainButton.enable(); } }
}
function alertMsg(m){ try{ tg?.showAlert ? tg.showAlert(m) : alert(m); }catch(e){ alert(m); } }
submitBtn.onclick=doSubmit;

// ================= TELEGRAM + ДОСТУП =================
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData
  ? window.Telegram.WebApp : null;
function haptic(){ try{ tg?.HapticFeedback?.selectionChanged(); }catch(e){} }

const API_URL = "https://iohjhsexdgxamuafccht.supabase.co/functions/v1/api";
let SESSION=null, ASSIGNMENT=null;
async function api(action, payload){
  const r = await fetch(API_URL, {method:"POST", headers:{"content-type":"application/json"},
    body: JSON.stringify({action, initData: tg?.initData ?? "", payload})});
  return r.json();
}
function gate(ic,title,text){
  document.getElementById("gate").innerHTML=`<div class="ic">${ic}</div><h2>${title}</h2><p>${text}</p>`;
  document.body.classList.add("gating");
  if(tg?.MainButton) tg.MainButton.hide();
}
function showForm(){ document.body.classList.remove("gating"); }
function applyAssignment(a){
  ASSIGNMENT=a;
  const sel=document.getElementById("locSelect");
  if(sel && a.location_name){
    if(![...sel.options].some(o=>o.value===a.location_name||o.text===a.location_name))
      sel.add(new Option(a.location_name, a.location_name));
    sel.value=a.location_name; data.location=a.location_name; sel.disabled=true;
  }
  updateProg();
}
async function initApp(){
  if(!tg){
    // Локальний файл або ?preview — режим перегляду дизайну. Публічне посилання в браузері — заглушка.
    const preview = location.protocol==="file:" || location.search.includes("preview");
    if(preview){ document.getElementById("pvbanner").style.display="block"; showForm(); updateProg(); }
    else { gate("📱","Відкрийте у Telegram","Ця анкета працює лише через бота Кебабці."); }
    return;
  }
  document.documentElement.classList.add("is-tg");
  tg.ready(); tg.expand();
  tg.MainButton.onClick(doSubmit);
  gate("⏳","Перевірка доступу…","Хвилинку.");
  try{
    const me = await api("me", null);
    if(!me.authorized){ gate("🔒","Немає доступу","Ця анкета лише для запрошених таємних покупців."+(me.reason?` [${me.reason}]`:"")+(me.id?` · Ваш ID: ${me.id}`:"")+(me.dbg?" "+JSON.stringify(me.dbg):"")); return; }
    SESSION=me;
    const open=(me.assignments||[]).filter(a=>a.status!=="done");
    if(open.length===0){ gate("📭","Немає активних завдань","Наразі для вас немає призначених перевірок."); return; }
    applyAssignment(open[0]);
    showForm();
    tg.MainButton.setText("Надіслати звіт"); tg.MainButton.show();
  }catch(e){ gate("⚠️","Помилка зʼєднання","Спробуйте, будь ласка, пізніше."); }
}
initApp();
</script>
